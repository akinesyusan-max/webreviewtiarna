<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Review Shop</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --pink: #f5dce9;
    --pink-light: #fff5fb;
    --pink-text: #f3bfdc;
    --text: #222;
    --gray: #888;
    --border: #eeeeee;
    --shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans Thai",
        Arial,
        sans-serif;

    background: #fafafa;
    color: var(--text);
    min-height: 100vh;
}


/* =====================================================
   PAGE
===================================================== */

.page {
    width: 100%;
    max-width: 760px;
    margin: 30px auto;
    padding: 0 18px 80px;
}


/* =====================================================
   SHOP HEADER
===================================================== */

.shop-header {
    background: white;
    border-radius: 32px;
    overflow: hidden;
    box-shadow: var(--shadow);
    margin-bottom: 22px;
}

.banner {
    width: 100%;
    height: 230px;

    background: var(--pink-light);
    background-size: cover;
    background-position: center;

    display: flex;
    align-items: center;
    justify-content: center;
}

.banner-placeholder {
    color: #bbb;
    font-size: 16px;
}

.shop-info {
    padding: 0 25px 28px;
    text-align: center;
    position: relative;
}

.logo {
    width: 100px;
    height: 100px;

    border-radius: 50%;
    background: white;

    object-fit: cover;

    border: 5px solid white;

    box-shadow:
        0 6px 18px rgba(0, 0, 0, 0.12);

    margin-top: -50px;

    position: relative;
}

.shop-name {
    font-size: 28px;
    font-weight: 700;
    margin-top: 12px;
}

.shop-description {
    color: #888;
    margin-top: 7px;
    line-height: 1.6;
    white-space: pre-line;
}


/* =====================================================
   VOTE
===================================================== */

.vote-box {
    display: grid;
    grid-template-columns: 1fr 1fr;

    background: white;

    border-radius: 24px;

    box-shadow: var(--shadow);

    overflow: hidden;

    margin-bottom: 25px;
}

.vote-button {
    border: 0;

    background: white;

    padding: 20px;

    cursor: pointer;

    transition: 0.2s;

    border-right: 1px solid #eee;
}

.vote-button:last-child {
    border-right: 0;
}

.vote-button:hover {
    background: #fff7fb;
}

.vote-number {
    font-size: 25px;
    font-weight: 700;
}

.vote-label {
    color: #888;
    margin-top: 5px;
    font-size: 14px;
}


/* =====================================================
   SECTION TITLE
===================================================== */

.section-title {
    font-size: 23px;
    font-weight: 700;

    margin: 35px 5px 20px;
}


/* =====================================================
   SUMMARY
===================================================== */

.summary {
    background: white;

    border-radius: 28px;

    box-shadow: var(--shadow);

    padding: 30px;

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 20px;

    align-items: center;
}

.average {
    font-size: 70px;
    font-weight: 800;
    line-height: 1;
}

.average-side {
    text-align: right;
}

.stars {
    font-size: 27px;
    letter-spacing: 2px;
}

.star-empty {
    color: #cfcfcf;
}

.review-total {
    color: #888;
    margin-top: 8px;
}


/* =====================================================
   REVIEWS
===================================================== */

.review-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.review-card {
    background: white;

    border-radius: 25px;

    padding: 25px;

    box-shadow: var(--shadow);
}

.review-top {
    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 15px;
}

.reviewer {
    font-weight: 700;
    font-size: 18px;
}

.review-date {
    color: #999;
    font-size: 13px;
}

.review-stars {
    margin-top: 9px;

    font-size: 20px;

    letter-spacing: 2px;
}

.review-text {
    margin-top: 15px;

    line-height: 1.7;

    white-space: pre-line;

    color: #444;
}

.review-image {
    width: 100%;

    max-height: 400px;

    object-fit: cover;

    border-radius: 18px;

    margin-top: 16px;
}


/* =====================================================
   ADD REVIEW
===================================================== */

.add-review-button {
    width: 100%;

    padding: 17px;

    border: 0;

    border-radius: 20px;

    background: #222;

    color: white;

    font-size: 16px;

    cursor: pointer;

    margin-top: 20px;
}

.add-review-button:hover {
    opacity: 0.85;
}


/* =====================================================
   MODAL
===================================================== */

.modal {
    display: none;

    position: fixed;

    inset: 0;

    background: rgba(0, 0, 0, 0.45);

    z-index: 1000;

    padding: 20px;

    overflow-y: auto;
}

.modal.show {
    display: flex;

    align-items: center;

    justify-content: center;
}

.modal-box {
    width: 100%;

    max-width: 550px;

    background: white;

    border-radius: 28px;

    padding: 28px;

    box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.2);
}

.modal-title {
    font-size: 24px;

    font-weight: 700;

    margin-bottom: 22px;
}

.close-button {
    float: right;

    border: 0;

    background: transparent;

    font-size: 25px;

    cursor: pointer;
}


/* =====================================================
   FORM
===================================================== */

.form-group {
    margin-bottom: 18px;
}

.form-label {
    display: block;

    font-weight: 600;

    margin-bottom: 8px;
}

input,
textarea,
select {
    width: 100%;

    border: 1px solid #ddd;

    border-radius: 14px;

    padding: 13px 15px;

    font-size: 15px;

    font-family: inherit;

    outline: none;
}

input:focus,
textarea:focus,
select:focus {
    border-color: #d995b5;
}

textarea {
    min-height: 120px;

    resize: vertical;
}

.form-button {
    width: 100%;

    border: 0;

    border-radius: 15px;

    padding: 14px;

    background: #222;

    color: white;

    font-size: 16px;

    cursor: pointer;
}

.form-button:hover {
    opacity: 0.85;
}

.secondary-button {
    background: #eee;

    color: #222;

    margin-top: 10px;
}


/* =====================================================
   STAR SELECTOR
===================================================== */

.star-selector {
    display: flex;

    gap: 7px;

    margin-top: 8px;
}

.star-choice {
    border: 0;

    background: transparent;

    font-size: 32px;

    cursor: pointer;

    color: #ccc;
}

.star-choice.active {
    color: #222;
}


/* =====================================================
   ADMIN BUTTON
===================================================== */

.admin-button {
    position: fixed;

    right: 20px;

    bottom: 20px;

    border: 0;

    border-radius: 50px;

    padding: 13px 20px;

    background: white;

    color: #222;

    box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.15);

    cursor: pointer;

    z-index: 500;
}

.admin-button:hover {
    background: #f7f7f7;
}


/* =====================================================
   ADMIN PANEL
===================================================== */

.admin-panel {
    display: none;
}

.admin-panel.show {
    display: block;
}

.admin-section {
    background: white;

    border: 1px solid #eee;

    border-radius: 24px;

    padding: 22px;

    margin-bottom: 20px;

    box-shadow: var(--shadow);
}

.admin-section-title {
    font-size: 20px;

    font-weight: 700;

    margin-bottom: 20px;
}

.image-preview {
    width: 100%;

    max-height: 200px;

    object-fit: cover;

    border-radius: 15px;

    margin-top: 10px;

    display: none;
}

.logo-preview {
    width: 100px;

    height: 100px;

    object-fit: cover;

    border-radius: 50%;

    margin-top: 10px;

    display: none;
}


/* =====================================================
   ADMIN REVIEW
===================================================== */

.admin-review {
    border: 1px solid #eee;

    border-radius: 17px;

    padding: 17px;

    margin-bottom: 12px;
}

.admin-review-actions {
    display: flex;

    gap: 8px;

    margin-top: 13px;
}

.small-button {
    border: 0;

    padding: 9px 14px;

    border-radius: 10px;

    cursor: pointer;
}

.edit-button {
    background: #f3f3f3;
}

.delete-button {
    background: #222;

    color: white;
}

.logout-button {
    background: #eee;

    color: #222;
}


/* =====================================================
   MINUS POPUP
===================================================== */

.minus-popup {
    display: none;

    position: fixed;

    inset: 0;

    background:
        rgba(255, 255, 255, 0.72);

    backdrop-filter: blur(5px);

    -webkit-backdrop-filter: blur(5px);

    z-index: 2000;

    align-items: center;

    justify-content: center;

    padding: 25px;
}

.minus-popup.show {
    display: flex;
}

.minus-popup-box {
    width: 100%;

    max-width: 630px;

    background: #fff5fb;

    border-radius: 34px;

    padding: 42px 35px 45px;

    text-align: center;

    box-shadow:
        0 15px 35px rgba(0, 0, 0, 0.10);
}

.minus-popup-text {
    color: #f5c4df;

    font-size: 28px;

    font-weight: 800;

    line-height: 1.35;

    white-space: pre-line;

    margin-bottom: 35px;
}

.minus-popup-link {
    display: block;

    width: 85%;

    margin: auto;

    padding: 19px 25px;

    border-radius: 50px;

    background: #cbd5dd;

    color: white;

    text-decoration: none;

    font-size: 17px;

    font-weight: 600;

    transition: 0.2s;
}

.minus-popup-link:hover {
    background: #b9c4cd;
}

.minus-popup-close {
    margin-top: 18px;

    border: 0;

    background: transparent;

    color: #aaa;

    cursor: pointer;

    font-size: 14px;
}


/* =====================================================
   HIDDEN
===================================================== */

.hidden {
    display: none !important;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    .page {
        margin-top: 15px;

        padding:
            0
            12px
            80px;
    }

    .banner {
        height: 180px;
    }

    .shop-name {
        font-size: 24px;
    }

    .summary {
        padding: 22px;
    }

    .average {
        font-size: 55px;
    }

    .stars {
        font-size: 21px;
    }

    .admin-button {
        right: 14px;

        bottom: 14px;
    }

    .minus-popup-box {
        padding:
            32px
            20px
            35px;

        border-radius: 28px;
    }

    .minus-popup-text {
        font-size: 21px;
    }

    .minus-popup-link {
        width: 90%;
    }
}

</style>
</head>


<body>


<div class="page">


<!-- =====================================================
     CUSTOMER PAGE
===================================================== -->

<div id="customerPage">


    <!-- SHOP -->

    <section class="shop-header">

        <div
            id="banner"
            class="banner"
        >

            <span
                id="bannerPlaceholder"
                class="banner-placeholder"
            >
                รูปแบนเนอร์
            </span>

        </div>


        <div class="shop-info">



            <div
                id="shopName"
                class="shop-name"
            >
                My Cute Shop
            </div>


            <div
                id="shopDescription"
                class="shop-description"
            >
                ร้านค้าน่ารัก ๆ ของเรา
            </div>

        </div>

    </section>


    <!-- VOTE -->

    <section class="vote-box">

        <button
            class="vote-button"
            onclick="voteUp()"
        >

            <div
                id="upVotes"
                class="vote-number"
            >
                359
            </div>

            <div class="vote-label">
                +1 โหวต
            </div>

        </button>


        <button
            class="vote-button"
            onclick="voteDown()"
        >

            <div
                id="downVotes"
                class="vote-number"
            >
                0
            </div>

            <div class="vote-label">
                -1 โหวต
            </div>

        </button>

    </section>


    <!-- RATING -->

    <div class="section-title">
        การจัดอันดับและความคิดเห็น
    </div>


    <section class="summary">

        <div
            id="averageRating"
            class="average"
        >
            0.0
        </div>


        <div class="average-side">

            <div
                id="averageStars"
                class="stars"
            >
                ☆☆☆☆☆
            </div>


            <div
                id="reviewTotal"
                class="review-total"
            >
                ทั้งหมด 0 รีวิว
            </div>

        </div>

    </section>


    <!-- REVIEWS -->

    <div class="section-title">
        รีวิวจากลูกค้า
    </div>


    <div
        id="reviewList"
        class="review-list"
    >
    </div>


    <button
        class="add-review-button"
        onclick="openReviewModal()"
    >
        เพิ่มรีวิว
    </button>


</div>


<!-- =====================================================
     ADMIN PAGE
===================================================== -->

<div
    id="adminPage"
    class="admin-panel"
>


    <!-- ADMIN HEADER -->

    <section class="shop-header">

        <div
            class="shop-info"
            style="padding-top:30px;"
        >

            <div class="shop-name">
                ADMIN PANEL
            </div>

            <div class="shop-description">
                จัดการข้อมูลเว็บไซต์
            </div>

        </div>

    </section>


    <!-- SHOP MANAGEMENT -->

    <section class="admin-section">

        <div class="admin-section-title">
            จัดการร้าน
        </div>


        <div class="form-group">

            <label class="form-label">
                ชื่อร้าน
            </label>

            <input
                id="adminShopName"
                type="text"
            >

        </div>


        <div class="form-group">

            <label class="form-label">
                คำอธิบาย
            </label>

            <textarea
                id="adminShopDescription"
            ></textarea>

        </div>


        <div class="form-group">

            <label class="form-label">
                รูปแบนเนอร์
            </label>

            <input
                id="bannerInput"
                type="file"
                accept="image/*"
                onchange="previewBanner(event)"
            >


            <img
                id="bannerPreview"
                class="image-preview"
                alt="ตัวอย่างแบนเนอร์"
            >

        </div>


        <div class="form-group">

            <label class="form-label">
                โลโก้
            </label>

            <input
                id="logoInput"
                type="file"
                accept="image/*"
                onchange="previewLogo(event)"
            >


            <img
                id="logoPreview"
                class="logo-preview"
                alt="ตัวอย่างโลโก้"
            >

        </div>


        <button
            class="form-button"
            onclick="saveShop()"
        >
            บันทึกข้อมูลร้าน
        </button>

    </section>


    <!-- MINUS SETTINGS -->

    <section class="admin-section">

        <div class="admin-section-title">
            ตั้งค่าปุ่ม -1
        </div>


        <div class="form-group">

            <label class="form-label">
                ข้อความที่แสดง
            </label>

            <textarea
                id="adminMinusText"
                placeholder="ข้อความที่จะแสดงเมื่อกด -1"
            ></textarea>

        </div>


        <div class="form-group">

            <label class="form-label">
                ข้อความบนปุ่ม
            </label>

            <input
                id="adminMinusButtonText"
                type="text"
                placeholder="เปิดลิงก์"
            >

        </div>


        <div class="form-group">

            <label class="form-label">
                ลิงก์ที่จะเปิด
            </label>

            <input
                id="adminMinusLink"
                type="url"
                placeholder="https://example.com"
            >

        </div>


        <button
            class="form-button"
            onclick="saveMinusSettings()"
        >
            บันทึกการตั้งค่า
        </button>

    </section>


    <!-- REVIEW MANAGEMENT -->

    <section class="admin-section">

        <div class="admin-section-title">
            จัดการรีวิว
        </div>


        <div
            id="adminReviewList"
        ></div>


        <button
            class="form-button"
            onclick="openAdminReviewModal()"
        >
            + เพิ่มรีวิว
        </button>

    </section>


    <button
        class="form-button logout-button"
        onclick="logoutAdmin()"
    >
        ออกจากระบบ
    </button>


</div>

</div>


<!-- =====================================================
     ADMIN LOGIN
===================================================== -->

<div
    id="loginModal"
    class="modal"
>

    <div class="modal-box">


        <button
            class="close-button"
            onclick="closeModal('loginModal')"
        >
            ×
        </button>


        <div class="modal-title">
            Admin Login
        </div>


        <div class="form-group">

            <label class="form-label">
                รหัสผ่าน
            </label>


            <input
                id="adminPassword"
                type="password"
                placeholder="กรอกรหัสผ่าน"
            >

        </div>


        <button
            class="form-button"
            onclick="loginAdmin()"
        >
            เข้าสู่ระบบ
        </button>

    </div>

</div>


<!-- =====================================================
     CUSTOMER REVIEW MODAL
===================================================== -->

<div
    id="reviewModal"
    class="modal"
>

    <div class="modal-box">


        <button
            class="close-button"
            onclick="closeModal('reviewModal')"
        >
            ×
        </button>


        <div class="modal-title">
            เพิ่มรีวิว
        </div>


        <div class="form-group">

            <label class="form-label">
                ชื่อ
            </label>


            <input
                id="customerName"
                type="text"
                placeholder="ชื่อของคุณ"
            >

        </div>


        <div class="form-group">

            <label class="form-label">
                คะแนน
            </label>


            <div
                id="customerStarSelector"
                class="star-selector"
            >

                <button
                    class="star-choice"
                    onclick="selectCustomerStar(1)"
                >★</button>


                <button
                    class="star-choice"
                    onclick="selectCustomerStar(2)"
                >★</button>


                <button
                    class="star-choice"
                    onclick="selectCustomerStar(3)"
                >★</button>


                <button
                    class="star-choice"
                    onclick="selectCustomerStar(4)"
                >★</button>


                <button
                    class="star-choice"
                    onclick="selectCustomerStar(5)"
                >★</button>

            </div>

        </div>


        <div class="form-group">

            <label class="form-label">
                รีวิว
            </label>


            <textarea
                id="customerText"
                placeholder="เขียนรีวิวของคุณ..."
            ></textarea>

        </div>


        <div class="form-group">

            <label class="form-label">
                รูปภาพ
            </label>


            <input
                id="customerImage"
                type="file"
                accept="image/*"
            >

        </div>


        <button
            class="form-button"
            onclick="submitCustomerReview()"
        >
            ส่งรีวิว
        </button>

    </div>

</div>


<!-- =====================================================
     ADMIN REVIEW MODAL
===================================================== -->

<div
    id="adminReviewModal"
    class="modal"
>

    <div class="modal-box">


        <button
            class="close-button"
            onclick="closeModal('adminReviewModal')"
        >
            ×
        </button>


        <div
            id="adminReviewModalTitle"
            class="modal-title"
        >
            เพิ่มรีวิว
        </div>


        <div class="form-group">

            <label class="form-label">
                ชื่อลูกค้า
            </label>


            <input
                id="adminReviewName"
                type="text"
            >

        </div>


        <div class="form-group">

            <label class="form-label">
                คะแนน
            </label>


            <select id="adminReviewRating">

                <option value="5">
                    5 ดาว
                </option>

                <option value="4">
                    4 ดาว
                </option>

                <option value="3">
                    3 ดาว
                </option>

                <option value="2">
                    2 ดาว
                </option>

                <option value="1">
                    1 ดาว
                </option>

            </select>

        </div>


        <div class="form-group">

            <label class="form-label">
                ข้อความรีวิว
            </label>


            <textarea
                id="adminReviewText"
            ></textarea>

        </div>


        <div class="form-group">

            <label class="form-label">
                รูปภาพรีวิว
            </label>


            <input
                id="adminReviewImage"
                type="file"
                accept="image/*"
            >

        </div>


        <button
            class="form-button"
            onclick="saveAdminReview()"
        >
            บันทึก
        </button>

    </div>

</div>


<!-- =====================================================
     MINUS POPUP
===================================================== -->

<div
    id="minusPopup"
    class="minus-popup"
>

    <div class="minus-popup-box">


        <div
            id="minusPopupText"
            class="minus-popup-text"
        >
            กรุณาส่งหลักฐาน - แคปแชท และแจ้งปัญหาแอดมิน
            ผ่านลิงค์ด้านล่าง
        </div>


        <a
            id="minusPopupLink"
            class="minus-popup-link"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
        >
            เปิดลิงก์
        </a>


        <button
            class="minus-popup-close"
            onclick="closeMinusPopup()"
        >
            ปิด
        </button>

    </div>

</div>


<!-- ADMIN BUTTON -->

<button
    class="admin-button"
    onclick="openAdminLogin()"
>
    Admin
</button>


<script>

/* =====================================================
   ADMIN PASSWORD
===================================================== */

const ADMIN_PASSWORD = "1234";


/* =====================================================
   DEFAULT DATA
===================================================== */

const defaultData = {

    shop: {

        name: "My Cute Shop",

/* =====================================================
   RATING
===================================================== */

function renderRating() {

    const reviews =
        data.reviews;


    if (reviews.length === 0) {

        document.getElementById(
            "averageRating"
        ).textContent =
            "0.0";


        document.getElementById(
            "averageStars"
        ).innerHTML =
            "☆☆☆☆☆";


        document.getElementById(
            "reviewTotal"
        ).textContent =
            "ทั้งหมด 0 รีวิว";


        return;

    }


    let total = 0;


    reviews.forEach(
        review => {

            total +=
                Number(review.rating);

        }
    );


    const average =
        total / reviews.length;


    document.getElementById(
        "averageRating"
    ).textContent =
        average.toFixed(1);


    document.getElementById(
        "averageStars"
    ).innerHTML =
        createStars(average);


    document.getElementById(
        "reviewTotal"
    ).textContent =
        `ทั้งหมด ${reviews.length} รีวิว`;

}


/* =====================================================
   STARS
===================================================== */

function createStars(rating) {

    let result = "";


    for (
        let i = 1;
        i <= 5;
        i++
    ) {

        if (
            i <= Math.round(rating)
        ) {

            result += "★";

        } else {

            result +=
                '<span class="star-empty">☆</span>';

        }

    }


    return result;

}


/* =====================================================

===================================================== */

function renderReviews() {

    const list =

            "reviewList"
        );


    list.innerHTML = "";


    if (data.reviews.length === 0) {

        list.innerHTML =
            `
            <div class="review-card">
                ยังไม่มีรีวิว
            </div>
            `;

        return;

    }


    data.reviews.forEach(
        review => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "review-card";


            let imageHTML = "";


            if (review.image) {

                imageHTML =
                    `
                    <img
                        class="review-image"
                        src="${review.image}"
                        alt="รูปรีวิว"
                    >
                    `;

            }


            card.innerHTML =
                `
                <div class="review-top">

                    <div class="reviewer">
                        ${escapeHTML(review.name)}
                    </div>

                    <div class="review-date">
                        ${escapeHTML(review.date)}
                    </div>

                </div>


                <div class="review-stars">
                    ${createStars(review.rating)}
                </div>


                <div class="review-text">
                    ${escapeHTML(review.text)}
                </div>


                ${imageHTML}

                `;


            list.appendChild(card);

        }
    );

}

/* =====================================================

===================================================== */

function editReview(id) {

    const review =
        data.reviews.find(
            item =>
                item.id === id
        );


    if (!review) return;


    editingReviewId =
        id;


    document.getElementById(
        "adminReviewModalTitle"
    ).textContent =
        "แก้ไขรีวิว";


    document.getElementById(
        "adminReviewName"
    ).value =
        review.name;


    document.getElementById(
        "adminReviewRating"
    ).value =
        review.rating;


    document.getElementById(
        "adminReviewText"
    ).value =
        review.text;


    document.getElementById(
        "adminReviewImage"
    ).value =
        "";


    openModal(
        "adminReviewModal"
    );

}


/* =====================================================
   SAVE ADMIN REVIEW
===================================================== */

async function saveAdminReview() {

    const name =
        document.getElementById(
            "adminReviewName"
        ).value.trim();


    const rating =
        Number(
            document.getElementById(
                "adminReviewRating"
            ).value
        );


    const text =
        document.getElementById(
            "adminReviewText"
        ).value.trim();


    const imageFile =
        document.getElementById(
            "adminReviewImage"
        ).files[0];


    if (!name) {

        alert(
            "กรุณากรอกชื่อลูกค้า"
        );

        return;

    }


    if (!text) {

        alert(
            "กรุณากรอกข้อความรีวิว"
        );

        return;

    }


    let image = "";


    if (editingReviewId) {

        const oldReview =
            data.reviews.find(
                item =>
                    item.id ===
                    editingReviewId
            );


        image =
            oldReview
                ? oldReview.image
                : "";


        if (imageFile) {

            image =
                await fileToBase64(
                    imageFile
                );

        }


        oldReview.name =
            name;


        oldReview.rating =
            rating;


        oldReview.text =
            text;


        oldReview.image =
            image;


    } else {

        if (imageFile) {

            image =
                await fileToBase64(
                    imageFile
                );

        }


        data.reviews.unshift({

            id:
                Date.now(),

            name:
                name,

            rating:
                rating,

            text:
                text,

            image:
                image,

            date:
                new Date()
                    .toLocaleDateString(
                        "th-TH"
                    )

        });

    }


    saveData();


    closeModal(
        "adminReviewModal"
    );


    renderAdminReviews();


    renderCustomerPage();

}


/* =====================================================
   DELETE REVIEW
===================================================== */

function deleteReview(id) {

    const confirmed =
        confirm(
            "ต้องการลบรีวิวนี้หรือไม่?"
        );


    if (!confirmed) return;


    data.reviews =
        data.reviews.filter(
            review =>
                review.id !== id
        );


    saveData();


    renderAdminReviews();


    renderCustomerPage();

}

/* =====================================================
   FILE TO BASE64
===================================================== */

function fileToBase64(file) {

    return new Promise(
        (
            resolve,
            reject
        ) => {

            const reader =
                new FileReader();


            reader.onload =
                () =>
                    resolve(
                        reader.result
                    );


            reader.onerror =
                reject;


            reader.readAsDataURL(
                file
            );

        }
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   CLICK OUTSIDE MODAL
===================================================== */

window.addEventListener(
    "click",
    function(event) {

        if (
            event.target.classList.contains(
                "modal"
            )
        ) {

            event.target.classList.remove(
                "show"
            );

        }


        if (
            event.target.id ===
            "minusPopup"
        ) {

            closeMinusPopup();

        }

    }
);


/* =====================================================
   ESC KEY
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Escape"
        ) {

            closeMinusPopup();

        }

    }
);
