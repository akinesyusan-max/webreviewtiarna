<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pink Blossom Store & Queue</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Kanit & Inter -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Kanit:wght@300;400;500;600&display=swap');
        
        body {
            font-family: 'Kanit', 'Inter', sans-serif;
            background-color: #fce7f3;
            -webkit-tap-highlight-color: transparent;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .marquee-container {
            overflow: hidden;
            white-space: nowrap;
            width: 100%;
        }
        .marquee-content {
            display: inline-block;
            animation: marquee 16s linear infinite;
        }
        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        .glass-nav {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        theme: {
                            50: '#fdf2f8',
                            100: '#fce7f3',
                            200: '#fbcfe8',
                            300: '#f9a8d4',
                            400: '#f472b6',
                            500: '#ec4899',
                            600: '#db2777'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="flex justify-center h-screen overflow-hidden text-gray-800 bg-gray-100">

    <!-- App Main Container (Mobile Frame Simulator) -->
    <div id="app-container" class="w-full max-w-md bg-theme-50 h-full relative flex flex-col shadow-2xl overflow-hidden mx-auto">
        
        <!-- Admin Hamburger Menu Button (Top Right) -->
        <button id="admin-menu-btn" onclick="navigate('admin-login')" class="absolute top-4 right-4 z-[60] w-10 h-10 bg-white/90 backdrop-blur-md rounded-full shadow-md flex items-center justify-center text-gray-700 hover:text-theme-500 transition-colors">
            <i class="fa-solid fa-bars text-lg"></i>
        </button>

        <!-- Dynamic Content Body -->
        <main id="main-content" class="flex-1 overflow-y-auto no-scrollbar pb-24 relative"></main>

        <!-- Floating Bottom Navigation Bar -->
        <nav class="absolute bottom-4 left-4 right-4 glass-nav rounded-2xl shadow-lg border border-theme-100 flex justify-around items-center py-3 px-2 z-50">
            <button onclick="navigate('home')" class="nav-btn flex flex-col items-center gap-1 w-16 transition-colors" data-target="home">
                <i class="fa-solid fa-house text-xl text-gray-400"></i>
                <span class="text-[10px] font-medium text-gray-500">หน้าหลัก</span>
            </button>
            <button onclick="navigate('products')" class="nav-btn flex flex-col items-center gap-1 w-16 transition-colors" data-target="products">
                <i class="fa-solid fa-bag-shopping text-xl text-gray-400"></i>
                <span class="text-[10px] font-medium text-gray-500">สินค้า</span>
            </button>
            <button onclick="navigate('queue')" class="nav-btn flex flex-col items-center gap-1 w-16 transition-colors" data-target="queue">
                <i class="fa-solid fa-list-ol text-xl text-gray-400"></i>
                <span class="text-[10px] font-medium text-gray-500">เช็คคิว</span>
            </button>
            <button onclick="navigate('account')" class="nav-btn flex flex-col items-center gap-1 w-16 transition-colors" data-target="account">
                <i class="fa-solid fa-user text-xl text-gray-400"></i>
                <span class="text-[10px] font-medium text-gray-500">บัญชี</span>
            </button>
        </nav>

        <!-- Global Toast Notification -->
        <div id="toast" class="absolute top-16 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-5 py-2.5 rounded-full text-sm font-medium shadow-xl opacity-0 transition-opacity duration-300 pointer-events-none z-[100] whitespace-nowrap">
            แจ้งเตือน
        </div>
    </div>

    <!-- Application Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, query, onSnapshot, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'pink-blossom-store';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        
        let app, db, auth;
        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
        } catch (e) {
            console.error("Firebase init error:", e);
        }

        const state = {
            user: null,
            isAdmin: false,
            currentView: 'home',
            store: {
                isOpen: true,
                marqueeText: "ยินดีต้อนรับสู่ Pink Blossom 🌸 เปิดให้บริการทุกวัน สั่งซื้อหรือจองคิวได้เลยค่ะ!"
            },
            queues: [],
            cart: [],
            pendingPayment: null,
            selectedProductModal: null,
            userData: {
                name: '',
                lineId: '',
                caption: 'ยินดีต้อนรับสู่ร้านค้าของเราค่ะ 🌸',
                bannerUrl: '',
                profileUrl: '',
                outstandingBalance: 0,
                points: 0,
                history: [],
                extraContacts: []
            },
            products: [
                { id: 'p1', name: 'เซ็ตบำรุงผิวซากุระ', desc: 'เซ็ตบำรุงผิวหน้าสูตรอ่อนโยน ผิวเนียนนุ่มชุ่มชื้น', price: 1290, category: 'skincare', image: 'https://placehold.co/300x300/fbcfe8/ec4899?text=Skincare' },
                { id: 'p2', name: 'ลิปสติกสีพีช', desc: 'ลิปเนื้อแมตต์กำมะหยี่ ติดทนนานตลอดวัน', price: 450, category: 'makeup', image: 'https://placehold.co/300x300/fbcfe8/ec4899?text=Lipstick' },
                { id: 'p3', name: 'น้ำหอมกลิ่นเชอร์รี่บลอสซั่ม', desc: 'กลิ่นหอมละมุนดั่งดอกซากุระบานสะพรั่ง', price: 2500, category: 'fragrance', image: 'https://placehold.co/300x300/fbcfe8/ec4899?text=Perfume' },
                { id: 'p4', name: 'พาเลทตาโทนหวาน', desc: 'พาเลทอายแชโดว์ 9 เฉดสีโทนชมพูพีช', price: 890, category: 'makeup', image: 'https://placehold.co/300x300/fbcfe8/ec4899?text=Palette' },
                { id: 'p5', name: 'ครีมกันแดดเนื้อบางเบา', desc: 'SPF50+ PA++++ ป้องกันรังสี UV ได้ดีเยี่ยม', price: 690, category: 'skincare', image: 'https://placehold.co/300x300/fbcfe8/ec4899?text=Sunscreen' },
                { id: 'p6', name: 'บลัชออนเนื้อครีม', desc: 'บลัชออนแก้มใส แก้มอมชมพูธรรมชาติ', price: 350, category: 'makeup', image: 'https://placehold.co/300x300/fbcfe8/ec4899?text=Blush' }
            ]
        };

        const getStoreRef = () => doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'main');
        const getQueuesRef = () => collection(db, 'artifacts', appId, 'public', 'data', 'queues');
        const getUserRef = (uid) => doc(db, 'artifacts', appId, 'users', uid, 'profile', 'main');

        async function initApp() {
            renderLoading();
            try {
                if (typeof __initial_auth_token !== 'undefined') {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        state.user = user;
                        setupListeners();
                    } else {
                        state.user = null;
                        renderView();
                    }
                });
            } catch (error) {
                console.error("Auth error:", error);
                showToast("ไม่สามารถเชื่อมต่อระบบได้");
                renderView();
            }
        }

        function setupListeners() {
            if (!state.user) return;

            onSnapshot(getStoreRef(), (docSnapshot) => {
                if (docSnapshot.exists()) {
                    state.store = { ...state.store, ...docSnapshot.data() };
                } else {
                    setDoc(getStoreRef(), { isOpen: true, marqueeText: state.store.marqueeText });
                }
                if (['home', 'admin'].includes(state.currentView)) renderView();
            }, (err) => console.error(err));

            onSnapshot(query(getQueuesRef()), (snapshot) => {
                state.queues = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                state.queues.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                if (['queue', 'admin'].includes(state.currentView)) renderView();
            }, (err) => console.error(err));

            if (!state.user.isAnonymous) {
                onSnapshot(getUserRef(state.user.uid), (docSnapshot) => {
                    if (docSnapshot.exists()) {
                        state.userData = { ...state.userData, ...docSnapshot.data() };
                    } else {
                        setDoc(getUserRef(state.user.uid), state.userData);
                    }
                    if (['account', 'admin'].includes(state.currentView)) renderView();
                }, (err) => console.error(err));
            } else {
                state.userData = { name: '', lineId: '', caption: '', outstandingBalance: 0, points: 0, history: [], extraContacts: [] };
                if (state.currentView === 'account') renderView();
            }
        }

        window.navigate = function(view) {
            state.currentView = view;
            updateNavUI();
            renderView();
        };

        window.showToast = function(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.remove('opacity-0');
            setTimeout(() => toast.classList.add('opacity-0'), 3000);
        };

        function updateNavUI() {
            document.querySelectorAll('.nav-btn').forEach(btn => {
                const icon = btn.querySelector('i');
                const text = btn.querySelector('span');
                if (btn.dataset.target === state.currentView) {
                    icon.classList.remove('text-gray-400');
                    icon.classList.add('text-theme-500');
                    text.classList.remove('text-gray-500');
                    text.classList.add('text-theme-600');
                } else {
                    icon.classList.add('text-gray-400');
                    icon.classList.remove('text-theme-500');
                    text.classList.add('text-gray-500');
                    text.classList.remove('text-theme-600');
                }
            });
        }

        function renderLoading() {
            document.getElementById('main-content').innerHTML = `
                <div class="flex h-full items-center justify-center">
                    <i class="fa-solid fa-circle-notch fa-spin text-4xl text-theme-300"></i>
                </div>
            `;
        }

        function renderView() {
            const container = document.getElementById('main-content');
            const adminBtn = document.getElementById('admin-menu-btn');
            
            if (['home', 'products', 'queue', 'account'].includes(state.currentView)) {
                adminBtn.classList.remove('hidden');
            } else {
                adminBtn.classList.add('hidden');
            }

            container.innerHTML = '';
            switch (state.currentView) {
                case 'home': container.innerHTML = renderHomeView(); break;
                case 'products': container.innerHTML = renderProductsView(); break;
                case 'payment': container.innerHTML = renderPaymentView(); break;
                case 'queue': container.innerHTML = renderQueueView(); break;
                case 'account': container.innerHTML = renderAccountView(); break;
                case 'admin-login': container.innerHTML = renderAdminLoginView(); break;
                case 'admin': container.innerHTML = renderAdminView(); break;
                default: container.innerHTML = renderHomeView();
            }
        }

        function renderHomeView() {
            const statusColor = state.store.isOpen ? 'bg-green-500' : 'bg-red-500';
            const statusText = state.store.isOpen ? 'ร้านเปิดให้บริการ' : 'ร้านปิดชั่วคราว';

            return `
                <div class="pb-6">
                    <!-- Banner & Profile matching image exactly -->
                    <div class="px-4 pt-4">
                        <div class="relative">
                            <div class="h-44 w-full rounded-2xl border-2 border-purple-200 overflow-hidden shadow-sm bg-cover bg-center" style="background-image: url('https://placehold.co/600x250/fbcfe8/f9a8d4?text=Sakura+Blossom');"></div>
                            
                            <div class="absolute -bottom-8 left-6 w-20 h-20 rounded-full border-4 border-white bg-white shadow-md overflow-hidden z-10 flex items-center justify-center">
                                <img src="https://placehold.co/200x200/fdf2f8/ec4899?text=Avatar" alt="Profile" class="w-full h-full object-cover">
                            </div>
                        </div>
                    </div>

                    <div class="px-6 pt-10 flex flex-col items-start">
                        <div class="flex items-center justify-between w-full">
                            <h1 class="text-xl font-bold text-gray-800 tracking-wide">Pink Blossom Store</h1>
                            <div class="flex items-center gap-1.5 bg-white px-3 py-1 rounded-full shadow-sm border border-gray-100">
                                <span class="flex h-2.5 w-2.5 relative">
                                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full ${statusColor} opacity-75"></span>
                                    <span class="relative inline-flex rounded-full h-2.5 w-2.5 ${statusColor}"></span>
                                </span>
                                <span class="text-xs font-semibold ${state.store.isOpen ? 'text-green-700' : 'text-red-600'}">${statusText}</span>
                            </div>
                        </div>
                        <p class="text-xs text-gray-500 mt-1">ยินดีต้อนรับเข้าสู่ร้านค้าออนไลน์ บริการด้วยใจ 🌸</p>
                    </div>

                    <div class="bg-theme-100 py-2.5 px-4 my-4 text-theme-600 text-sm font-medium border-y border-theme-200">
                        <div class="marquee-container">
                            <div class="marquee-content">${state.store.marqueeText}</div>
                        </div>
                    </div>

                    <div class="px-5 space-y-6">
                        <section>
                            <h2 class="text-lg font-bold text-gray-800 mb-3"><i class="fa-solid fa-calendar-check text-theme-400 mr-1.5"></i> จองคิวบริการ</h2>
                            <div class="grid grid-cols-2 gap-3">
                                <button onclick="initiateQueuePayment('full')" class="bg-gradient-to-br from-theme-400 to-theme-600 text-white rounded-2xl py-5 shadow-md hover:shadow-lg transition-all active:scale-95 flex flex-col items-center gap-2" ${!state.store.isOpen ? 'disabled opacity-50' : ''}>
                                    <i class="fa-solid fa-wallet text-2xl"></i>
                                    <span class="font-medium text-sm">จอง & จ่ายเต็ม</span>
                                </button>
                                <button onclick="initiateQueuePayment('install')" class="bg-white text-theme-600 border border-theme-200 rounded-2xl py-5 shadow-sm hover:bg-theme-50 transition-all active:scale-95 flex flex-col items-center gap-2" ${!state.store.isOpen ? 'disabled opacity-50' : ''}>
                                    <i class="fa-solid fa-file-invoice-dollar text-2xl"></i>
                                    <span class="font-medium text-sm">ผ่อนจองคิว</span>
                                </button>
                            </div>
                            ${!state.store.isOpen ? '<p class="text-xs text-red-500 text-center mt-2 font-medium">* ขออภัย ร้านปิดรับคิวชั่วคราว</p>' : ''}
                        </section>

                        <section>
                            <div class="flex justify-between items-center mb-3">
                                <h2 class="text-lg font-bold text-gray-800"><i class="fa-solid fa-star text-yellow-400 mr-1.5"></i> สินค้าแนะนำ</h2>
                                <button onclick="navigate('products')" class="text-xs font-semibold text-theme-500 bg-theme-100 px-3 py-1 rounded-full">ดูทั้งหมด</button>
                            </div>
                            <div class="flex overflow-x-auto gap-4 pb-4 no-scrollbar">
                                ${state.products.slice(0, 4).map(p => `
                                    <div onclick="openProductModal('${p.id}')" class="min-w-[140px] bg-white rounded-2xl shadow-sm border border-theme-100 overflow-hidden flex-shrink-0 cursor-pointer">
                                        <div class="h-32 bg-gray-50 p-2">
                                            <img src="${p.image}" class="w-full h-full object-cover rounded-xl">
                                        </div>
                                        <div class="p-3">
                                            <h3 class="text-xs font-medium text-gray-700 truncate">${p.name}</h3>
                                            <p class="text-theme-600 font-bold text-sm mt-1">฿${p.price}</p>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </section>
                    </div>
                </div>
            `;
        }

        function renderProductsView() {
            window.productFilter = window.productFilter || 'all';
            const filtered = window.productFilter === 'all' 
                ? state.products 
                : state.products.filter(p => p.category === window.productFilter);
            
            const cartTotal = state.cart.reduce((sum, item) => sum + item.price, 0);

            return `
                <div class="h-full flex flex-col bg-white">
                    <div class="p-5 border-b border-gray-100 sticky top-0 bg-white z-10 pb-3">
                        <h1 class="text-2xl font-bold text-gray-800 mb-4">สินค้าทั้งหมด</h1>
                        
                        <div class="relative mb-4">
                            <i class="fa-solid fa-magnifying-glass absolute left-4 top-3 text-gray-400"></i>
                            <input type="text" placeholder="ค้นหาสินค้า..." class="w-full bg-gray-50 border border-gray-200 rounded-2xl py-2.5 pl-11 pr-4 text-sm focus:outline-none focus:border-theme-400 transition">
                        </div>

                        <div class="flex gap-2 overflow-x-auto no-scrollbar">
                            <button onclick="setProdFilter('all')" class="px-4 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition ${window.productFilter === 'all' ? 'bg-theme-500 text-white' : 'bg-gray-100 text-gray-600'}">ทั้งหมด</button>
                            <button onclick="setProdFilter('skincare')" class="px-4 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition ${window.productFilter === 'skincare' ? 'bg-theme-500 text-white' : 'bg-gray-100 text-gray-600'}">สกินแคร์</button>
                            <button onclick="setProdFilter('makeup')" class="px-4 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition ${window.productFilter === 'makeup' ? 'bg-theme-500 text-white' : 'bg-gray-100 text-gray-600'}">เมคอัพ</button>
                            <button onclick="setProdFilter('fragrance')" class="px-4 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition ${window.productFilter === 'fragrance' ? 'bg-theme-500 text-white' : 'bg-gray-100 text-gray-600'}">น้ำหอม</button>
                        </div>
                    </div>

                    <div class="p-5 grid grid-cols-2 gap-4 flex-1 overflow-y-auto no-scrollbar pb-[140px]">
                        ${filtered.map(p => `
                            <div onclick="openProductModal('${p.id}')" class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col group cursor-pointer">
                                <div class="h-36 bg-theme-50 relative p-2">
                                    <img src="${p.image}" class="w-full h-full object-cover rounded-xl transition transform group-hover:scale-105">
                                </div>
                                <div class="p-3 flex-1 flex flex-col justify-between">
                                    <div>
                                        <h3 class="text-sm font-bold text-gray-800 leading-tight mb-1 truncate">${p.name}</h3>
                                        <p class="text-xs text-gray-400 truncate mb-2">${p.desc}</p>
                                    </div>
                                    <div class="flex items-center justify-between mt-auto">
                                        <span class="text-theme-600 font-bold text-sm">฿${p.price.toLocaleString()}</span>
                                        <button class="w-8 h-8 bg-theme-50 hover:bg-theme-100 text-theme-600 rounded-full flex items-center justify-center transition">
                                            <i class="fa-solid fa-plus text-xs"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <!-- Product Detail Modal -->
                    ${state.selectedProductModal ? `
                        <div class="fixed inset-0 bg-black/50 backdrop-blur-sm z-[110] flex items-center justify-center p-4">
                            <div class="bg-white rounded-3xl p-6 w-full max-w-sm relative shadow-2xl animate-in fade-in zoom-in duration-200">
                                <button onclick="closeProductModal()" class="absolute top-4 right-4 w-8 h-8 bg-gray-100 hover:bg-gray-200 rounded-full flex items-center justify-center text-gray-600 transition">
                                    <i class="fa-solid fa-xmark text-sm"></i>
                                </button>
                                <div class="h-56 bg-theme-50 rounded-2xl p-4 mb-4">
                                    <img src="${state.selectedProductModal.image}" class="w-full h-full object-cover rounded-xl shadow-sm">
                                </div>
                                <h2 class="text-lg font-bold text-gray-800 mb-1">${state.selectedProductModal.name}</h2>
                                <p class="text-xs text-gray-500 mb-3 leading-relaxed">${state.selectedProductModal.desc}</p>
                                
                                <div class="flex items-center justify-between mb-6 border-t border-gray-100 pt-3">
                                    <span class="text-2xl font-bold text-theme-600">฿${state.selectedProductModal.price.toLocaleString()}</span>
                                    <span class="text-xs font-semibold bg-theme-100 text-theme-600 px-3 py-1 rounded-full">สินค้าพร้อมส่ง</span>
                                </div>

                                <button onclick="addToCartFromModal('${state.selectedProductModal.id}')" class="w-full bg-gradient-to-r from-theme-400 to-theme-600 hover:opacity-95 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-theme-500/30 transition flex items-center justify-center gap-2">
                                    <i class="fa-solid fa-cart-shopping"></i> ใส่ตะกร้า
                                </button>
                            </div>
                        </div>
                    ` : ''}

                    ${state.cart.length > 0 ? `
                        <div class="fixed bottom-[72px] left-4 right-4 max-w-[400px] mx-auto bg-gray-900 text-white rounded-2xl p-4 shadow-2xl flex justify-between items-center z-40 border border-gray-700">
                            <div class="flex items-center gap-3">
                                <div class="bg-theme-500 w-10 h-10 rounded-full flex items-center justify-center relative shadow-inner">
                                    <i class="fa-solid fa-basket-shopping"></i>
                                    <span class="absolute -top-1 -right-1 bg-white text-theme-600 text-[10px] font-bold w-5 h-5 flex items-center justify-center rounded-full border border-gray-900">${state.cart.length}</span>
                                </div>
                                <div>
                                    <p class="text-[10px] text-gray-400 font-medium">ยอดชำระรวม</p>
                                    <p class="font-bold text-base leading-none">฿${cartTotal.toLocaleString()}</p>
                                </div>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="initiateProductPayment('install', ${cartTotal})" class="px-3 py-2 bg-gray-700 hover:bg-gray-600 rounded-xl text-[10px] font-bold transition">ผ่อนชำระ</button>

                            <div>
                                <label class="text-xs text-gray-500">ลิงก์รูปโปรไฟล์ (URL)</label>
                                <input type="text" id="editProfile" value="${state.userData.profileUrl || ''}" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-2.5 text-sm" placeholder="https://...">
                            </div>
                            <div class="flex gap-2 pt-2">
                                <button onclick="closeEditProfileModal()" class="flex-1 bg-gray-100 py-2.5 rounded-xl text-xs font-bold text-gray-600">ยกเลิก</button>
                                <button onclick="saveProfile()" class="flex-1 bg-theme-500 text-white py-2.5 rounded-xl text-xs font-bold">บันทึก</button>
                            </div>
                        </div>
                    </div>

                    <!-- Add Contact Modal -->
                    <div id="contactModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
                        <div class="bg-white rounded-2xl p-6 w-full max-w-sm space-y-4 shadow-2xl">
                            <h3 class="font-bold text-gray-800 text-lg">เพิ่มช่องทางติดต่อ</h3>
                            <div>
                                <label class="text-xs text-gray-500">ชื่อหัวข้อ (เช่น IG, Facebook, เบอร์โทร)</label>
                                <input type="text" id="contactTitle" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-2.5 text-sm">
                            </div>
                            <div>
                                <label class="text-xs text-gray-500">ข้อมูลติดต่อ</label>
                                <input type="text" id="contactValue" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-2.5 text-sm">
                            </div>
                            <div class="flex gap-2 pt-2">
                                <button onclick="closeAddContactModal()" class="flex-1 bg-gray-100 py-2.5 rounded-xl text-xs font-bold text-gray-600">ยกเลิก</button>
                                <button onclick="saveNewContact()" class="flex-1 bg-theme-500 text-white py-2.5 rounded-xl text-xs font-bold">เพิ่ม</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        window.setAuthMode = (m) => { window.authMode = m; renderView(); };
        
        window.doLogin = async () => {
            const e = document.getElementById('lEmail').value;
            const p = document.getElementById('lPass').value;
            if(!e||!p) return showToast('กรุณากรอกให้ครบ');
            renderLoading();
            try {
                await signInWithEmailAndPassword(auth, e, p);
                showToast('เข้าสู่ระบบสำเร็จ');
            } catch(err) {
                showToast('อีเมลหรือรหัสผ่านผิด');
                renderView();
            }
        };

        window.doRegister = async () => {
            const n = document.getElementById('rName').value;
            const l = document.getElementById('rLine').value;
            const e = document.getElementById('rEmail').value;
            const p = document.getElementById('rPass').value;
            if(!n||!l||!e||!p) return showToast('กรุณากรอกข้อมูลให้ครบ');
            
            renderLoading();
            try {
                const cred = await createUserWithEmailAndPassword(auth, e, p);
                await setDoc(getUserRef(cred.user.uid), {
                    name: n, lineId: l, caption: '', bannerUrl: '', profileUrl: '', outstandingBalance: 0, points: 0, history: [], extraContacts: []
                });
                showToast('สมัครสมาชิกสำเร็จ!');
            } catch(err) {
                showToast('เกิดข้อผิดพลาด: ' + err.message);
                renderView();
            }
        };

        window.doLogout = async () => {
            await signOut(auth);
            await signInAnonymously(auth);
            showToast('ออกจากระบบแล้ว');
        };

        window.openEditProfileModal = () => { document.getElementById('profileModal').classList.remove('hidden'); };
        window.closeEditProfileModal = () => { document.getElementById('profileModal').classList.add('hidden'); };
        window.saveProfile = async () => {
            if(!state.user || state.user.isAnonymous) return;
            const name = document.getElementById('editName').value;
            const caption = document.getElementById('editCaption').value;
            const bannerUrl = document.getElementById('editBanner').value;
            const profileUrl = document.getElementById('editProfile').value;
            try {
                await updateDoc(getUserRef(state.user.uid), { name, caption, bannerUrl, profileUrl });
                closeEditProfileModal();
                showToast('บันทึกโปรไฟล์สำเร็จ');
            } catch(e) { showToast('เกิดข้อผิดพลาด'); }
        };

        window.openAddContactModal = () => { document.getElementById('contactModal').classList.remove('hidden'); };
        window.closeAddContactModal = () => { document.getElementById('contactModal').classList.add('hidden'); };
        window.saveNewContact = async () => {
            if(!state.user || state.user.isAnonymous) return;
            const title = document.getElementById('contactTitle').value;
            const value = document.getElementById('contactValue').value;
            if(!title || !value) return showToast('กรุณากรอกให้ครบ');
            const contacts = state.userData.extraContacts || [];
            contacts.push({ title, value });
            try {
                await updateDoc(getUserRef(state.user.uid), { extraContacts: contacts });
                closeAddContactModal();
                showToast('เพิ่มช่องทางติดต่อสำเร็จ');
            } catch(e) { showToast('เกิดข้อผิดพลาด'); }
        };

        function renderAdminLoginView() {
            return `
                <div class="h-full flex flex-col items-center justify-center bg-gray-900 text-white p-6 relative">
                    <button onclick="navigate('home')" class="absolute top-4 left-4 w-10 h-10 bg-gray-800 rounded-full flex items-center justify-center text-gray-400 hover:text-white transition">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>
                    
                    <div class="w-16 h-16 bg-gray-800 border border-gray-700 rounded-2xl flex items-center justify-center text-3xl text-theme-500 mb-6 shadow-xl">
                        <i class="fa-solid fa-shield-halved"></i>
                    </div>
                    <h1 class="text-2xl font-bold mb-2">Admin Login</h1>
                    <p class="text-gray-400 text-xs mb-8">กรอกรหัสผ่านเพื่อเข้าสู่ระบบแอดมิน</p>
                    
                    <input type="password" id="adminPwd" placeholder="รหัสผ่าน" class="w-full max-w-[280px] bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-center text-white focus:outline-none focus:border-theme-500 mb-4 tracking-widest">
                    
                    <button onclick="checkAdmin()" class="w-full max-w-[280px] bg-theme-600 hover:bg-theme-500 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-theme-600/20 active:scale-95">เข้าสู่ระบบ</button>
                </div>
            `;
        }

        window.checkAdmin = () => {
            const p = document.getElementById('adminPwd').value;
            if(p === 'admin1234') {
                state.isAdmin = true;
                showToast('เข้าสู่โหมดแอดมิน');
                navigate('admin');
            } else {
                showToast('รหัสผ่านไม่ถูกต้อง');
            }
        };

        function renderAdminView() {
            if(!state.isAdmin) return renderAdminLoginView();

            return `
                <div class="min-h-full bg-gray-900 text-white p-4 pb-24">
                    <div class="flex justify-between items-center mb-6 sticky top-0 bg-gray-900/90 py-2 backdrop-blur z-10 border-b border-gray-800">
                        <h1 class="text-lg font-bold text-theme-400"><i class="fa-solid fa-toolbox mr-2"></i>Admin Dashboard</h1>
                        <button onclick="state.isAdmin=false; navigate('home')" class="bg-gray-800 px-3 py-1.5 rounded-lg text-xs font-medium text-gray-300 hover:text-white">ออกจากระบบ</button>
                    </div>

                    <div class="space-y-4">
                        <div class="bg-gray-800 rounded-2xl p-4 border border-gray-700">
                            <h2 class="text-sm font-bold text-gray-300 mb-3 border-b border-gray-700 pb-2">ตั้งค่าร้านค้า</h2>
                            <div class="flex justify-between items-center mb-4">
                                <span class="text-sm">สถานะเปิด-ปิดร้าน</span>
                                <button onclick="toggleStore()" class="w-12 h-6 rounded-full relative transition-colors ${state.store.isOpen ? 'bg-green-500' : 'bg-gray-600'}">
                                    <div class="w-4 h-4 bg-white rounded-full absolute top-1 transition-transform ${state.store.isOpen ? 'right-1' : 'left-1'}"></div>
                                </button>
                            </div>
                            <label class="text-[10px] text-gray-400 mb-1 block">ข้อความวิ่ง (Marquee)</label>
                            <textarea id="adminMarquee" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-sm text-gray-200 focus:border-theme-500 outline-none" rows="2">${state.store.marqueeText}</textarea>
                            <button onclick="saveStoreSettings()" class="w-full bg-gray-700 hover:bg-gray-600 mt-2 py-2 rounded-lg text-xs font-bold transition">บันทึกข้อความ</button>
                        </div>

                        <div class="bg-gray-800 rounded-2xl p-4 border border-gray-700">
                            <h2 class="text-sm font-bold text-gray-300 mb-3 border-b border-gray-700 pb-2 flex justify-between">
                                <span>จัดการคิวทั้งหมด</span>
                                <button onclick="addNewQueueAdmin()" class="text-xs bg-theme-600 px-2 py-1 rounded">+ เพิ่มคิว</button>
                            </h2>
                            <div class="space-y-2 max-h-60 overflow-y-auto no-scrollbar">
                                ${state.queues.length === 0 ? '<p class="text-xs text-gray-500 text-center py-4">ไม่มีคิว</p>' : ''}
                                ${state.queues.map(q => `
                                    <div class="bg-gray-900 border border-gray-700 p-3 rounded-xl flex flex-col gap-2">
                                        <div class="flex justify-between items-center">
                                            <div class="font-bold text-theme-400 text-sm">#${q.number} <span class="text-gray-300 text-xs font-normal ml-1">${q.name}</span></div>
                                            <select onchange="updateQStatus('${q.id}', this.value)" class="bg-gray-800 text-white text-xs border border-gray-600 rounded-lg p-1 outline-none">
                                                <option value="Waiting" ${q.status==='Waiting'?'selected':''}>รับคิว</option>
                                                <option value="Drafting" ${q.status==='Drafting'?'selected':''}>รอบรีฟ</option>
                                                <option value="Doing" ${q.status==='Doing'?'selected':''}>กำลังทำ</option>
                                                <option value="Finished" ${q.status==='Finished'?'selected':''}>เสร็จสิ้น</option>
                                            </select>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <div class="bg-gray-800 rounded-2xl p-4 border border-gray-700">
                            <h2 class="text-sm font-bold text-gray-300 mb-3 border-b border-gray-700 pb-2">จัดการยอดค้างผ่อน (ลูกค้าปัจจุบัน)</h2>
                            ${(!state.user || state.user.isAnonymous) ? `
                                <p class="text-xs text-yellow-500 bg-yellow-500/10 p-2 rounded">กรุณาเข้าสู่ระบบในแท็บบัญชีก่อน เพื่อจำลองการแก้ไขยอด</p>
                            ` : `
                                <div class="flex gap-2 items-center">
                                    <input type="number" id="adminBal" value="${state.userData.outstandingBalance}" class="flex-1 bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white outline-none">
                                    <button onclick="updateBal()" class="bg-theme-600 px-4 py-2 rounded-lg text-xs font-bold text-white">แก้ไขยอด</button>
                                </div>
                            `}
                        </div>
                    </div>
                </div>
            `;
        }

        window.toggleStore = async () => {
            try { await updateDoc(getStoreRef(), { isOpen: !state.store.isOpen }); } catch(e){}
        };
        window.saveStoreSettings = async () => {
            const m = document.getElementById('adminMarquee').value;
            try {
                await updateDoc(getStoreRef(), { marqueeText: m });
                showToast('บันทึกสำเร็จ');
            } catch(e){}
        };
        window.updateQStatus = async (id, st) => {
            try { await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'queues', id), { status: st }); } catch(e){}
        };
        window.addNewQueueAdmin = async () => {
            const name = prompt("ชื่อลูกค้าสำหรับคิวใหม่:");
            if(!name) return;
            const newNum = state.queues.length > 0 ? Math.max(...state.queues.map(q => q.number)) + 1 : 1;
            try {
                await addDoc(getQueuesRef(), { name, number: newNum, service: 'บริการพิเศษ', status: 'Waiting', timestamp: Date.now() });
                showToast('เพิ่มคิวสำเร็จ');
            } catch(e){}
        };
        window.updateBal = async () => {
            if(!state.user || state.user.isAnonymous) return;
            const b = parseInt(document.getElementById('adminBal').value) || 0;
            try {
                await updateDoc(getUserRef(state.user.uid), { outstandingBalance: b });
                showToast('อัพเดทยอดค้างผ่อนสำเร็จ');
            } catch(e){}
        };

        updateNavUI();
        initApp();
    </script>
</body>
</html>
