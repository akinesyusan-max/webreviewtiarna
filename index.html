<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Cute Shop - Review</title>

<style>
* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: #f7f7f7;
    color: #222;
    font-family: Arial, "Noto Sans Thai", sans-serif;
}

/* =========================
   MAIN PAGE
========================= */

.page {
    width: calc(100% - 32px);
    max-width: 760px;
    margin: 0 auto;
    padding: 18px 0 110px;
}

.card {
    background: #ffffff;
    border-radius: 28px;
    margin: 16px 0;
    padding: 24px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.07);
}

/* =========================
   SHOP HEADER
========================= */

.shop-header {
    padding: 0;
    overflow: hidden;
}

.banner {
    width: 100%;
    height: 220px;
    background: #fdeef7;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;
}

.banner img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
}

.shop-info {
    text-align: center;
    padding: 28px 20px 32px;
}

.logo {
    width: 86px;
    height: 86px;

    border-radius: 50%;
    object-fit: cover;

    background: #f5e8ef;

    margin: -70px auto 12px;

    position: relative;

    border: 5px solid white;

    display: none;
}

.shop-name {
    margin: 0;

    font-size: 32px;
    font-weight: 800;

    line-height: 1.2;
}

.shop-desc {
    margin: 10px 0 0;

    color: #777;

    font-size: 18px;

    line-height: 1.6;
}

/* =========================
   VOTE
========================= */

.vote-card {
    padding: 0;

    overflow: hidden;

    display: grid;
    grid-template-columns: 1fr 1fr;
}

.vote {
    border: none;

    background: white;

    min-height: 150px;

    padding: 25px 10px;

    text-align: center;

    cursor: pointer;
}

.vote + .vote {
    border-left: 1px solid #eeeeee;
}

.vote-number {
    display: block;

    font-size: 52px;

    font-weight: 800;

    color: #3b82f6;

    line-height: 1;
}

.vote-label {
    display: block;

    margin-top: 15px;

    color: #777;

    font-size: 20px;
}

.vote:hover {
    background: #fafafa;
}

.vote:active {
    transform: scale(.99);
}

/* =========================
   RATING
========================= */

.section-title {
    font-size: 30px;

    margin: 30px 0 16px;

    line-height: 1.25;
}

.rating-card {
    display: grid;

    grid-template-columns: 1fr 1fr;

    align-items: center;

    gap: 12px;
}

.average {
    font-size: 76px;

    font-weight: 900;

    line-height: 1;
}

.rating-right {
    text-align: center;
}

.stars {
    font-size: 32px;

    letter-spacing: 2px;

    white-space: nowrap;
}

.stars .empty {
    color: #d0d0d0;
}

.total-reviews {
    color: #888;

    font-size: 19px;

    margin-top: 8px;
}

/* =========================
   REVIEWS
========================= */

.review-header {
    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 12px;
}

.review-header h2 {
    margin: 0;

    font-size: 30px;
}

.add-review-btn {
    border: none;

    background: #222;

    color: white;

    border-radius: 18px;

    padding: 14px 22px;

    font-weight: 700;

    cursor: pointer;
}

.add-review-btn:hover {
    background: #444;
}

.reviews-list {
    margin-top: 18px;
}

.review-item {
    background: white;

    border: 1px solid #eeeeee;

    border-radius: 22px;

    padding: 20px;

    margin: 14px 0;
}

.review-stars {
    font-size: 22px;
}

.review-stars .muted {
    color: #ccc;
}

.review-name {
    font-weight: 800;

    font-size: 19px;

    margin-top: 8px;
}

.review-text {
    margin-top: 7px;

    font-size: 17px;

    line-height: 1.6;

    white-space: pre-wrap;
}

.review-date {
    color: #999;

    font-size: 13px;

    margin-top: 10px;
}

.empty {
    text-align: center;

    color: #999;

    padding: 40px 10px;
}

/* =========================
   ADMIN BUTTON
========================= */

.admin-fab {
    position: fixed;

    right: 18px;

    bottom: 18px;

    z-index: 20;

    border: none;

    background: white;

    color: #222;

    border-radius: 30px;

    padding: 15px 25px;

    box-shadow: 0 10px 30px rgba(0,0,0,.14);

    font-weight: 800;

    cursor: pointer;
}

/* =========================
   MODAL
========================= */

.modal-backdrop {
    position: fixed;

    inset: 0;

    background: rgba(0,0,0,.45);

    z-index: 50;

    display: none;

    align-items: center;

    justify-content: center;

    padding: 18px;
}

.modal-backdrop.show {
    display: flex;
}

.modal {
    width: min(620px, 100%);

    max-height: 90vh;

    overflow-y: auto;

    background: white;

    border-radius: 28px;

    padding: 25px;
}

.modal h2 {
    margin-top: 0;
}

/* =========================
   FORMS
========================= */

.form-group {
    margin: 15px 0;
}

.form-group label {
    display: block;

    font-weight: 700;

    margin-bottom: 7px;
}

input,
textarea,
select {
    width: 100%;

    border: 1px solid #ddd;

    border-radius: 14px;

    padding: 13px 14px;

    background: white;

    outline: none;
}

textarea {
    min-height: 110px;

    resize: vertical;
}

input:focus,
textarea:focus,
select:focus {
    border-color: #999;
}

.modal-actions {
    display: flex;

    gap: 10px;

    margin-top: 20px;
}

.btn {
    border: none;

    border-radius: 14px;

    padding: 13px 18px;

    font-weight: 700;

    cursor: pointer;
}

.btn-dark {
    background: #222;

    color: white;
}

.btn-light {
    background: #eeeeee;

    color: #222;
}

.btn-danger {
    background: #ffe1e1;

    color: #b00020;
}

.file-note {
    color: #888;

    font-size: 13px;

    margin-top: 6px;
}

/* =========================
   ADMIN
========================= */

.admin-panel .setting-block {
    border: 1px solid #eeeeee;

    border-radius: 20px;

    padding: 18px;

    margin: 15px 0;
}

.admin-panel h3 {
    margin-top: 0;
}

.admin-review {
    border: 1px solid #eeeeee;

    border-radius: 18px;

    padding: 15px;

    margin: 12px 0;
}

.admin-review-actions {
    display: flex;

    gap: 8px;

    margin-top: 12px;
}

.admin-review-actions button {
    border: none;

    border-radius: 10px;

    padding: 9px 13px;

    font-weight: 700;

    cursor: pointer;
}

/* =========================
   TOAST
========================= */

.toast {
    position: fixed;

    left: 50%;

    bottom: 24px;

    transform: translate(-50%, 20px);

    background: #222;

    color: white;

    padding: 13px 18px;

    border-radius: 14px;

    z-index: 100;

    opacity: 0;

    pointer-events: none;

    transition: .25s;
}

.toast.show {
    opacity: 1;

    transform: translate(-50%, 0);
}

/* =========================
   MOBILE
========================= */

@media (max-width: 560px) {

    .page {
        width: calc(100% - 28px);

        padding-top: 10px;
    }

    .banner {
        height: 175px;
    }

    .card {
        border-radius: 24px;

        padding: 18px;
    }

    .shop-name {
        font-size: 27px;
    }

    .shop-desc {
        font-size: 16px;
    }

    .vote {
        min-height: 125px;
    }

    .vote-number {
        font-size: 42px;
    }

    .vote-label {
        font-size: 17px;
    }

    .section-title {
        font-size: 26px;
    }

    .average {
        font-size: 58px;
    }

    .stars {
        font-size: 25px;
    }

    .review-header {
        align-items: stretch;

        flex-direction: column;
    }

    .add-review-btn {
        width: 100%;
    }
}
</style>
</head>


<body>

<main class="page">

    <!-- =========================
         SHOP HEADER
    ========================== -->

    <section class="card shop-header">

        <div class="banner">

            <img
                id="bannerImage"
                alt="แบนเนอร์ร้าน"
            >

        </div>


        <div class="shop-info">

            <img
                id="logoImage"
                class="logo"
                alt="โลโก้ร้าน"
            >

            <h1
                id="shopName"
                class="shop-name"
            >
                My Cute Shop
            </h1>

            <p
                id="shopDescription"
                class="shop-desc"
            >
                ร้านค้าน่ารัก ๆ ของเรา
            </p>

        </div>

    </section>


    <!-- =========================
         VOTE
    ========================== -->

    <section class="card vote-card">

        <button
            class="vote"
            onclick="vote('plus')"
        >

            <span
                id="plusVotes"
                class="vote-number"
            >
                359
            </span>

            <span class="vote-label">
                +1 โหวต
            </span>

        </button>


        <button
            class="vote"
            onclick="vote('minus')"
        >

            <span
                id="minusVotes"
                class="vote-number"
            >
                0
            </span>

            <span class="vote-label">
                -1 โหวต
            </span>

        </button>

    </section>


    <!-- =========================
         RATING
    ========================== -->

    <h2 class="section-title">
        การจัดอันดับและความคิดเห็น
    </h2>


    <section class="card rating-card">

        <div
            id="averageRating"
            class="average"
        >
            0.0
        </div>


        <div class="rating-right">

            <div
                id="ratingStars"
                class="stars"
            >
                ★★★★★
            </div>

            <div
                id="totalReviews"
                class="total-reviews"
            >
                ทั้งหมด 0 รีวิว
            </div>

        </div>

    </section>


    <!-- =========================
         REVIEWS
    ========================== -->

    <section class="card">

        <div class="review-header">

            <h2>
                รีวิวจากลูกค้า
            </h2>

            <button
                class="add-review-btn"
                onclick="openReviewModal()"
            >
                เพิ่มรีวิว
            </button>

        </div>


        <div
            id="reviewsList"
            class="reviews-list"
        ></div>

    </section>

</main>


<!-- =========================
     ADMIN BUTTON
========================= -->

<button
    class="admin-fab"
    onclick="openAdminLogin()"
>
    Admin
</button>


<!-- =========================
     REVIEW MODAL
========================= -->

<div
    id="reviewModal"
    class="modal-backdrop"
>

    <div class="modal">

        <h2>
            เพิ่มรีวิว
        </h2>


        <div class="form-group">

            <label>
                ชื่อผู้รีวิว
            </label>

            <input
                id="reviewName"
                type="text"
                maxlength="50"
                placeholder="กรอกชื่อ"
            >

        </div>


        <div class="form-group">

            <label>
                คะแนน
            </label>

            <select id="reviewRating">

                <option value="5">
                    ★★★★★ 5 คะแนน
                </option>

                <option value="4">
                    ★★★★☆ 4 คะแนน
                </option>

                <option value="3">
                    ★★★☆☆ 3 คะแนน
                </option>

                <option value="2">
                    ★★☆☆☆ 2 คะแนน
                </option>

                <option value="1">
                    ★☆☆☆☆ 1 คะแนน
                </option>

            </select>

        </div>


        <div class="form-group">

            <label>
                ข้อความรีวิว
            </label>

            <textarea
                id="reviewText"
                maxlength="1000"
                placeholder="เขียนรีวิวของคุณ..."
            ></textarea>

        </div>


        <div class="modal-actions">

            <button
                class="btn btn-light"
                onclick="closeModal('reviewModal')"
            >
                ยกเลิก
            </button>

            <button
                class="btn btn-dark"
                onclick="submitReview()"
            >
                ส่งรีวิว
            </button>

        </div>

    </div>

</div>


<!-- =========================
     MINUS MODAL
========================= -->

<div
    id="minusModal"
    class="modal-backdrop"
>

    <div class="modal">

        <h2>
            แจ้งปัญหา
        </h2>


        <p id="minusMessage"></p>


        <div class="modal-actions">

            <button
                class="btn btn-light"
                onclick="closeModal('minusModal')"
            >
                ปิด
            </button>


            <button
                id="minusLinkButton"
                class="btn btn-dark"
                onclick="openMinusLink()"
            >
                ไปยังหน้าที่เกี่ยวข้อง
            </button>

        </div>

    </div>

</div>


<!-- =========================
     LOGIN
========================= -->

<div
    id="loginModal"
    class="modal-backdrop"
>

    <div class="modal">

        <h2>
            Admin Login
        </h2>


        <div class="form-group">

            <label>
                Username
            </label>

            <input
                id="adminUsername"
                type="text"
            >

        </div>


        <div class="form-group">

            <label>
                Password
            </label>

            <input
                id="adminPassword"
                type="password"
            >

        </div>


        <div class="modal-actions">

            <button
                class="btn btn-light"
                onclick="closeModal('loginModal')"
            >
                ยกเลิก
            </button>


            <button
                class="btn btn-dark"
                onclick="loginAdmin()"
            >
                เข้าสู่ระบบ
            </button>

        </div>


        <p class="file-note">
            บัญชีเริ่มต้น: admin / admin123
        </p>

    </div>

</div>


<!-- =========================
     ADMIN PANEL
========================= -->

<div
    id="adminModal"
    class="modal-backdrop"
>

    <div class="modal admin-panel">

        <h2>
            Admin Panel
        </h2>


        <!-- SHOP SETTINGS -->

        <div class="setting-block">

            <h3>
                จัดการร้าน
            </h3>


            <div class="form-group">

                <label>
                    ชื่อร้าน
                </label>

                <input
                    id="adminShopName"
                    type="text"
                >

            </div>


            <div class="form-group">

                <label>
                    คำอธิบายร้าน
                </label>

                <textarea
                    id="adminShopDescription"
                ></textarea>

            </div>


            <div class="form-group">

                <label>
                    รูปแบนเนอร์
                </label>

                <input
                    id="bannerUpload"
                    type="file"
                    accept="image/*"
                >

                <div class="file-note">
                    เลือกรูปจากเครื่องได้
                </div>

            </div>


            <div class="form-group">

                <label>
                    โลโก้ร้าน
                </label>

                <input
                    id="logoUpload"
                    type="file"
                    accept="image/*"
                >

            </div>


            <button
                class="btn btn-dark"
                onclick="saveShopSettings()"
            >
                บันทึกข้อมูลร้าน
            </button>

        </div>


        <!-- MINUS SETTINGS -->

        <div class="setting-block">

            <h3>
                ตั้งค่าปุ่ม -1
            </h3>


            <div class="form-group">

                <label>
                    ข้อความที่แสดง
                </label>

                <textarea
                    id="adminMinusMessage"
                ></textarea>

            </div>


            <div class="form-group">

                <label>
                    ลิงก์เมื่อกดปุ่ม
                </label>

                <input
                    id="adminMinusLink"
                    type="url"
                    placeholder="https://example.com"
                >

            </div>


            <button
                class="btn btn-dark"
                onclick="saveMinusSettings()"
            >
                บันทึก
            </button>

        </div>


        <!-- REVIEW MANAGEMENT -->

        <div class="setting-block">

            <h3>
                จัดการรีวิว
            </h3>


            <div
                id="adminReviews"
            ></div>

        </div>


        <!-- ADMIN ACCOUNT -->

        <div class="setting-block">

            <h3>
                เปลี่ยนบัญชี Admin
            </h3>


            <div class="form-group">

                <label>
                    Username ใหม่
                </label>

                <input
                    id="newAdminUsername"
                    type="text"
                >

            </div>


            <div class="form-group">

                <label>
                    Password ใหม่
                </label>

                <input
                    id="newAdminPassword"
                    type="password"
                >

            </div>


            <button
                class="btn btn-dark"
                onclick="saveAdminLogin()"
            >
                บันทึกบัญชี Admin
            </button>

        </div>


        <div class="modal-actions">

            <button
                class="btn btn-light"
                onclick="logoutAdmin()"
            >
                ออกจากระบบ
            </button>


            <button
                class="btn btn-dark"
                onclick="closeModal('adminModal')"
            >
                ปิด
            </button>

        </div>

    </div>

</div>


<!-- TOAST -->

<div
    id="toast"
    class="toast"
></div>


<script>

/* =========================================================
   DATA
========================================================= */

const DEFAULT_DATA = {

    shopName: "My Cute Shop",

    shopDescription: "ร้านค้าน่ารัก ๆ ของเรา",

    banner: "",

    logo: "",

    plusVotes: 359,

    minusVotes: 0,

    minusMessage:
        "กรุณาส่งหลักฐาน แคปแชท และแจ้งปัญหาแอดมินผ่านลิงก์ด้านล่าง",

    minusLink: "",

    adminUsername: "admin",

    adminPassword: "admin123",

    reviews: []

};


/* =========================================================
   LOAD DATA
========================================================= */

function loadData() {

    const saved =
        localStorage.getItem("reviewShopData");

    if (!saved) {

        localStorage.setItem(
            "reviewShopData",
            JSON.stringify(DEFAULT_DATA)
        );

        return JSON.parse(
            JSON.stringify(DEFAULT_DATA)
        );
    }

    try {

        return {
            ...DEFAULT_DATA,
            ...JSON.parse(saved)
        };

    } catch {

        return JSON.parse(
            JSON.stringify(DEFAULT_DATA)
        );

    }

}


let data = loadData();


let isAdmin =
    sessionStorage.getItem(
        "reviewShopAdmin"
    ) === "true";


/* =========================================================
   SAVE
========================================================= */

function saveData() {

    localStorage.setItem(
        "reviewShopData",
        JSON.stringify(data)
    );

}


/* =========================================================
   SECURITY
========================================================= */

function escapeHTML(value) {

    return String(value)

        .replaceAll("&", "&amp;")

        .replaceAll("<", "&lt;")

        .replaceAll(">", "&gt;")

        .replaceAll('"', "&quot;")

        .replaceAll("'", "&#039;");
}


/* =========================================================
   RENDER SHOP
========================================================= */

function renderShop() {

    document.getElementById(
        "shopName"
    ).textContent = data.shopName;


    document.getElementById(
        "shopDescription"
    ).textContent = data.shopDescription;


    document.getElementById(
        "plusVotes"
    ).textContent = data.plusVotes;


    document.getElementById(
        "minusVotes"
    ).textContent = data.minusVotes;


    const banner =
        document.getElementById(
            "bannerImage"
        );


    if (data.banner) {

        banner.src = data.banner;

        banner.style.display =
            "block";

    } else {

        banner.style.display =
            "none";

    }


    const logo =
        document.getElementById(
            "logoImage"
        );


    if (data.logo) {

        logo.src = data.logo;

        logo.style.display =
            "block";

    } else {

        logo.style.display =
            "none";

    }

}


/* =========================================================
   RENDER REVIEWS
========================================================= */

function renderReviews() {

    const list =
        document.getElementById(
            "reviewsList"
        );


    const reviews =
        data.reviews || [];


    if (!reviews.length) {

        list.innerHTML =
            '<div class="empty">ยังไม่มีรีวิว</div>';

        updateRating();

        return;

    }


    list.innerHTML =
        reviews.map(review => {

            const rating =
                Number(review.rating);


            return `

                <article class="review-item">

                    <div class="review-stars">

                        ${"★".repeat(rating)}

                        <span class="muted">

                            ${"★".repeat(5 - rating)}

                        </span>

                    </div>


                    <div class="review-name">

                        ${escapeHTML(review.name)}

                    </div>


                    <div class="review-text">

                        ${escapeHTML(review.text)}

                    </div>


                    <div class="review-date">

                        ${escapeHTML(review.date || "")}

                    </div>

                </article>

            `;

        }).join("");


    updateRating();

}


/* =========================================================
   RATING
========================================================= */

function updateRating() {

    const reviews =
        data.reviews || [];


    const count =
        reviews.length;


    if (!count) {

        document.getElementById(
            "averageRating"
        ).textContent = "0.0";


        document.getElementById(
            "ratingStars"
        ).innerHTML =
            '<span class="empty">★★★★★</span>';


        document.getElementById(
            "totalReviews"
        ).textContent =
            "ทั้งหมด 0 รีวิว";


        return;

    }


    const total =
        reviews.reduce(
            (sum, review) =>
                sum + Number(review.rating),
            0
        );


    const average =
        total / count;


    const rounded =
        Math.round(average);


    document.getElementById(
        "averageRating"
    ).textContent =
        average.toFixed(1);


    document.getElementById(
        "ratingStars"
    ).innerHTML =

        "★".repeat(rounded)

        +

        '<span class="empty">'

        +

        "★".repeat(5 - rounded)

        +

        "</span>";


    document.getElementById(
        "totalReviews"
    ).textContent =
        `ทั้งหมด ${count.toLocaleString("th-TH")} รีวิว`;

}


/* =========================================================
   REVIEW MODAL
========================================================= */

function openReviewModal() {

    document.getElementById(
        "reviewName"
    ).value = "";


    document.getElementById(
        "reviewRating"
    ).value = "5";


    document.getElementById(
        "reviewText"
    ).value = "";


    document.getElementById(
        "reviewModal"
    ).classList.add("show");

}


/* =========================================================
   SUBMIT REVIEW
========================================================= */

function submitReview() {

    const name =
        document.getElementById(
            "reviewName"
        ).value.trim();


    const text =
        document.getElementById(
            "reviewText"
        ).value.trim();


    const rating =
        Number(
            document.getElementById(
                "reviewRating"
            ).value
        );


    if (!name || !text) {

        showToast(
            "กรุณากรอกชื่อและข้อความรีวิว"
        );

        return;

    }


    data.reviews.unshift({

        id: Date.now(),

        name: name,

        text: text,

        rating: rating,

        date:
            new Date()
                .toLocaleDateString("th-TH")

    });


    saveData();


    renderReviews();


    closeModal(
        "reviewModal"
    );


    showToast(
        "ส่งรีวิวเรียบร้อยแล้ว"
    );

}


/* =========================================================
   VOTE
========================================================= */

function vote(type) {

    if (type === "plus") {

        data.plusVotes++;

        saveData();

        renderShop();

        showToast(
            "บันทึก +1 แล้ว"
        );

        return;

    }


    data.minusVotes++;

    saveData();

    renderShop();


    document.getElementById(
        "minusMessage"
    ).textContent =
        data.minusMessage;


    const button =
        document.getElementById(
            "minusLinkButton"
        );


    if (data.minusLink) {

        button.style.display =
            "block";

    } else {

        button.style.display =
            "none";

    }


    document.getElementById(
        "minusModal"
    ).classList.add("show");

}


/* =========================================================
   MINUS LINK
========================================================= */

function openMinusLink() {

    if (!data.minusLink) {
        return;
    }


    window.open(
        data.minusLink,
        "_blank",
        "noopener,noreferrer"
    );

}


/* =========================================================
   ADMIN LOGIN
========================================================= */

function openAdminLogin() {

    if (isAdmin) {

        openAdminPanel();

        return;

    }


    document.getElementById(
        "adminUsername"
    ).value = "";


    document.getElementById(
        "adminPassword"
    ).value = "";


    document.getElementById(
        "loginModal"
    ).classList.add("show");

}


/* =========================================================
   LOGIN
========================================================= */

function loginAdmin() {

    const username =
        document.getElementById(
            "adminUsername"
        ).value;


    const password =
        document.getElementById(
            "adminPassword"
        ).value;


    if (

        username === data.adminUsername

        &&

        password === data.adminPassword

    ) {

        isAdmin = true;


        sessionStorage.setItem(
            "reviewShopAdmin",
            "true"
        );


        closeModal(
            "loginModal"
        );


        openAdminPanel();


        showToast(
            "เข้าสู่ระบบ Admin แล้ว"
        );

    } else {

        showToast(
            "Username หรือ Password ไม่ถูกต้อง"
        );

    }

}


/* =========================================================
   ADMIN PANEL
========================================================= */

function openAdminPanel() {

    if (!isAdmin) {
        return;
    }


    document.getElementById(
        "adminShopName"
    ).value =
        data.shopName;


    document.getElementById(
        "adminShopDescription"
    ).value =
        data.shopDescription;


    document.getElementById(
        "adminMinusMessage"
    ).value =
        data.minusMessage;


    document.getElementById(
        "adminMinusLink"
    ).value =
        data.minusLink;


    document.getElementById(
        "newAdminUsername"
    ).value =
        data.adminUsername;


    document.getElementById(
        "newAdminPassword"
    ).value =
        data.adminPassword;


    renderAdminReviews();


    document.getElementById(
        "adminModal"
    ).classList.add("show");

}


/* =========================================================
   FILE READER
========================================================= */

function readFileAsDataURL(file) {

    return new Promise(
        (resolve, reject) => {

            const reader =
                new FileReader();


            reader.onload =
                () => resolve(
                    reader.result
                );


            reader.onerror =
                reject;


            reader.readAsDataURL(
                file
            );

        }
    );

}


/* =========================================================
   SHOP SETTINGS
========================================================= */

function saveShopSettings() {

    data.shopName =
        document.getElementById(
            "adminShopName"
        ).value.trim()
        ||
        "My Cute Shop";


    data.shopDescription =
        document.getElementById(
            "adminShopDescription"
        ).value.trim()
        ||
        "ร้านค้าน่ารัก ๆ ของเรา";


    const bannerFile =
        document.getElementById(
            "bannerUpload"
        ).files[0];


    const logoFile =
        document.getElementById(
            "logoUpload"
        ).files[0];


    const tasks = [];


    if (bannerFile) {

        tasks.push(

            readFileAsDataURL(
                bannerFile
            ).then(result => {

                data.banner =
                    result;

            })

        );

    }


    if (logoFile) {

        tasks.push(

            readFileAsDataURL(
                logoFile
            ).then(result => {

                data.logo =
                    result;

            })

        );

    }


    Promise.all(tasks)
        .then(() => {

            saveData();

            renderShop();


            document.getElementById(
                "bannerUpload"
            ).value = "";


            document.getElementById(
                "logoUpload"
            ).value = "";


            showToast(
                "บันทึกข้อมูลร้านแล้ว"
            );

        });

}


/* =========================================================
   MINUS SETTINGS
========================================================= */

function saveMinusSettings() {

    data.minusMessage =
        document.getElementById(
            "adminMinusMessage"
        ).value.trim();


    data.minusLink =
        document.getElementById(
            "adminMinusLink"
        ).value.trim();


    saveData();


    showToast(
        "บันทึกการตั้งค่า -1 แล้ว"
    );

}


/* =========================================================
   ADMIN REVIEWS
========================================================= */

function renderAdminReviews() {

    const container =
        document.getElementById(
            "adminReviews"
        );


    if (!data.reviews.length) {

        container.innerHTML =
            '<div class="empty">ยังไม่มีรีวิว</div>';

        return;

    }


    container.innerHTML =
        data.reviews.map(review => {

            return `

                <div class="admin-review">

                    <div>

                        <strong>

                            ${escapeHTML(review.name)}

                        </strong>

                    </div>


                    <div>

                        ${"★".repeat(
                            Number(review.rating)
                        )}

                    </div>


                    <div>

                        ${escapeHTML(
                            review.text
                        )}

                    </div>


                    <div class="admin-review-actions">

                        <button
                            class="btn-light"
                            onclick="editReview(${review.id})"
                        >
                            แก้ไข
                        </button>


                        <button
                            class="btn-danger"
                            onclick="deleteReview(${review.id})"
                        >
                            ลบ
                        </button>

                    </div>

                </div>

            `;

        }).join("");

}


/* =========================================================
   EDIT REVIEW
========================================================= */

function editReview(id) {

    const review =
        data.reviews.find(
            item =>
                item.id === id
        );


    if (!review) {
        return;
    }


    const name =
        prompt(
            "แก้ชื่อผู้รีวิว",
            review.name
        );


    if (name === null) {
        return;
    }


    const text =
        prompt(
            "แก้ข้อความรีวิว",
            review.text
        );


    if (text === null) {
        return;
    }


    const rating =
        prompt(
            "แก้คะแนน 1-5",
            review.rating
        );


    if (rating === null) {
        return;
    }


    const score =
        Math.min(
            5,
            Math.max(
                1,
                Number(rating) || 5
            )
        );


    review.name =
        name.trim() ||
        review.name;


    review.text =
        text.trim() ||
        review.text;


    review.rating =
        score;


    saveData();


    renderReviews();

    renderAdminReviews();


    showToast(
        "แก้ไขรีวิวแล้ว"
    );

}


/* =========================================================
   DELETE REVIEW
========================================================= */

function deleteReview(id) {

    const ok =
        confirm(
            "ต้องการลบรีวิวนี้ใช่หรือไม่?"
        );


    if (!ok) {
        return;
    }


    data.reviews =
        data.reviews.filter(
            review =>
                review.id !== id
        );


    saveData();


    renderReviews();

    renderAdminReviews();


    showToast(
        "ลบรีวิวแล้ว"
    );

}


/* =========================================================
   ADMIN ACCOUNT
========================================================= */

function saveAdminLogin() {

    const username =
        document.getElementById(
            "newAdminUsername"
        ).value.trim();


    const password =
        document.getElementById(
            "newAdminPassword"
        ).value;


    if (!username || !password) {

        showToast(
            "กรุณากรอก Username และ Password"
        );

        return;

    }


    data.adminUsername =
        username;


    data.adminPassword =
        password;


    saveData();


    showToast(
        "เปลี่ยนบัญชี Admin แล้ว"
    );

}


/* =========================================================
   LOGOUT
========================================================= */

function logoutAdmin() {

    isAdmin = false;


    sessionStorage.removeItem(
        "reviewShopAdmin"
    );


    closeModal(
        "adminModal"
    );


    showToast(
        "ออกจากระบบแล้ว"
    );

}


/* =========================================================
   CLOSE MODAL
========================================================= */

function closeModal(id) {

    document.getElementById(
        id
    ).classList.remove("show");

}


/* =========================================================
   TOAST
========================================================= */

function showToast(message) {

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        window.toastTimer
    );


    window.toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            2200
        );

}


/* =========================================================
   CLOSE WHEN CLICK OUTSIDE
========================================================= */

document
    .querySelectorAll(
        ".modal-backdrop"
    )
    .forEach(backdrop => {

        backdrop.addEventListener(
            "click",
            event => {

                if (
                    event.target ===
                    backdrop
                ) {

                    backdrop.classList.remove(
                        "show"
                    );

                }

            }
        );

    });


/* =========================================================
   START
========================================================= */

renderShop();

renderReviews();

</script>
