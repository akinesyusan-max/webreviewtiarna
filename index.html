<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PANTERz Cosshop - Cosplay Rental & More!</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Prompt & Kanit) -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            pink: '#ffb6c1',
                            darkpink: '#ff69b4',
                            deep: '#e05297',
                            lightpink: '#fff0f5',
                            bg: '#fcf0f5',
                            dark: '#1e1a1d',
                            accent: '#ff8da1'
                        }
                    },
                    fontFamily: {
                        sans: ['Prompt', 'Kanit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #121212;
        }
        .paw-print {
            background-image: radial-gradient(#ff69b4 15%, transparent 16%), radial-gradient(#ff69b4 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            opacity: 0.05;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #ffb6c1;
            border-radius: 10px;
        }
    </style>
</head>
<body class="flex justify-center items-center min-h-screen p-0 sm:p-4 text-slate-800">

    <!-- Mobile Frame Container -->
    <div x-data="cosplayApp()" class="w-full max-w-[430px] h-[100vh] sm:h-[912px] bg-brand-bg relative overflow-hidden sm:rounded-[40px] shadow-2xl flex flex-col border-0 sm:border-8 border-slate-900">
        
        <!-- ========================================== -->
        <!-- USER / CLIENT VIEW -->
        <!-- ========================================== -->
        <template x-if="!isAdminLoggedIn">
            <div class="flex-1 flex flex-col h-full overflow-hidden relative">
                
                <!-- Top Header Bar -->
                <header class="bg-gradient-to-r from-brand-darkpink via-pink-400 to-brand-darkpink text-white px-4 pt-3 pb-3 relative shadow-md">
                    <div class="flex justify-between items-center mb-2">
                        <!-- Hamburger Menu (Admin Trigger) -->
                        <button @click="showAdminModal = true" class="p-1 hover:bg-white/20 rounded-lg transition text-xl">
                            <i class="fa-solid fa-bars"></i>
                        </button>
                        <div class="text-xs font-semibold bg-white/20 px-3 py-1 rounded-full backdrop-blur-sm">
                            <i class="fa-solid fa-paw mr-1"></i> Cosplay Rental & More!
                        </div>
                        <div class="flex gap-2 text-lg">
                            <button @click="activeTab = 'contact'" class="hover:text-pink-200"><i class="fa-regular fa-bell"></i></button>
                            <button @click="activeTab = 'stamps'" class="hover:text-pink-200"><i class="fa-regular fa-heart"></i></button>
                        </div>
                    </div>

                    <!-- Logo Banner Area -->
                    <div class="flex items-center gap-3 mt-1">
                        <div class="relative">
                            <img src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?auto=format&fit=crop&q=80&w=200" class="w-16 h-16 rounded-full border-4 border-white shadow-lg object-cover">
                            <span class="absolute -bottom-1 -right-1 bg-yellow-400 text-xs text-slate-900 rounded-full w-5 h-5 flex items-center justify-center font-bold shadow">👑</span>
                        </div>
                        <div>
                            <h1 class="text-xl font-black tracking-wide flex items-center gap-1 font-sans text-white drop-shadow">
                                <i class="fa-solid fa-paw text-pink-200 text-sm"></i> PANTERz Cosshop <i class="fa-solid fa-heart text-pink-200 text-xs"></i>
                            </h1>
                            <p class="text-xs text-pink-100 font-light">บริการเช่าชุดคอสเพลย์ ส่งทั่วไทย ✨</p>
                        </div>
                    </div>
                </header>

                <!-- Scrollable Content View Port -->
                <main class="flex-1 overflow-y-auto custom-scrollbar pb-24 relative">
                    
                    <!-- ----------------------------------------- -->
                    <!-- PAGE 1: HOME PAGE -->
                    <!-- ----------------------------------------- -->
                    <div x-show="activeTab === 'home'" class="p-4 space-y-4">
                        
                        <!-- Search Box -->
                        <div class="relative">
                            <input type="text" x-model="searchQuery" placeholder="ค้นหาตัวละคร, ชื่อเรื่อง หรือเกม..." 
                                class="w-full pl-10 pr-10 py-2.5 rounded-full border-2 border-brand-pink text-sm bg-white focus:outline-none focus:ring-2 focus:ring-brand-darkpink/50 shadow-sm">
                            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-brand-darkpink"></i>
                            <button class="absolute right-3 top-2.5 text-brand-darkpink text-sm"><i class="fa-solid fa-sliders"></i></button>
                        </div>

                        <!-- 5 Circular/Pill Navigation Items -->
                        <div class="flex justify-between items-center text-center gap-1 overflow-x-auto pb-1 no-scrollbar text-xs">
                            <button @click="selectedCategory = 'ทั้งหมด'" :class="selectedCategory === 'ทั้งหมด' ? 'bg-brand-darkpink text-white font-bold' : 'bg-white text-slate-700'" class="px-3.5 py-2 rounded-full shadow-sm whitespace-nowrap transition flex items-center gap-1">
                                <i class="fa-solid fa-house"></i> ทั้งหมด
                            </button>
                            <button @click="selectedCategory = 'Genshin Impact'" :class="selectedCategory === 'Genshin Impact' ? 'bg-brand-darkpink text-white font-bold' : 'bg-white text-slate-700'" class="px-3.5 py-2 rounded-full shadow-sm whitespace-nowrap transition flex items-center gap-1">
                                <i class="fa-solid fa-star"></i> Genshin
                            </button>
                            <button @click="selectedCategory = 'Honkai: Star Rail'" :class="selectedCategory === 'Honkai: Star Rail' ? 'bg-brand-darkpink text-white font-bold' : 'bg-white text-slate-700'" class="px-3.5 py-2 rounded-full shadow-sm whitespace-nowrap transition flex items-center gap-1">
                                <i class="fa-solid fa-moon"></i> Star Rail
                            </button>
                            <button @click="selectedCategory = 'Zenless Zone Zero'" :class="selectedCategory === 'Zenless Zone Zero' ? 'bg-brand-darkpink text-white font-bold' : 'bg-white text-slate-700'" class="px-3.5 py-2 rounded-full shadow-sm whitespace-nowrap transition flex items-center gap-1">
                                <i class="fa-solid fa-bolt"></i> ZZZ
                            </button>
                            <button @click="selectedCategory = 'อนิเมะ'" :class="selectedCategory === 'อนิเมะ' ? 'bg-brand-darkpink text-white font-bold' : 'bg-white text-slate-700'" class="px-3.5 py-2 rounded-full shadow-sm whitespace-nowrap transition flex items-center gap-1">
                                <i class="fa-solid fa-cat"></i> อนิเมะ
                            </button>
                        </div>

                        <!-- Promo Banner -->
                        <div class="bg-gradient-to-r from-pink-200 via-pink-100 to-purple-100 p-3 rounded-2xl border border-pink-300 flex justify-between items-center shadow-sm relative overflow-hidden">
                            <div class="z-10">
                                <span class="bg-brand-darkpink text-white text-[10px] px-2 py-0.5 rounded-full font-bold uppercase tracking-wider">โปรโมชั่นประจำเดือน</span>
                                <h3 class="font-bold text-slate-800 text-sm mt-1">ลดสูงสุด 100.- + ส่งฟรี! 📦</h3>
                                <p class="text-[11px] text-slate-600">เมื่อจองคิวเช่าล่วงหน้า 7 วันขึ้นไป (มัดจำ 50%)</p>
                            </div>
                            <i class="fa-solid fa-dog text-4xl text-brand-darkpink/30 absolute right-2 bottom-1"></i>
                        </div>

                        <!-- Recommended Costumes Grid -->
                        <div>
                            <div class="flex justify-between items-center mb-3">
                                <h2 class="font-bold text-slate-800 flex items-center gap-1.5 text-base">
                                    <i class="fa-solid fa-paw text-brand-darkpink"></i> ตัวละครแนะนำ
                                </h2>
                                <span class="text-xs text-brand-darkpink font-medium cursor-pointer hover:underline">ดูทั้งหมด ></span>
                            </div>

                            <div class="grid grid-cols-2 gap-3">
                                <template x-for="item in filteredCostumes" :key="item.id">
                                    <div class="bg-white rounded-2xl overflow-hidden shadow-sm border border-pink-100 flex flex-col justify-between hover:shadow-md transition">
                                        <div class="relative">
                                            <img :src="item.image" class="w-full h-44 object-cover">
                                            <span class="absolute top-2 left-2 bg-slate-900/70 text-white text-[10px] px-2 py-0.5 rounded-full backdrop-blur-sm" x-text="item.category"></span>
                                            <button @click="item.liked = !item.liked" class="absolute top-2 right-2 w-7 h-7 bg-white/80 backdrop-blur-sm rounded-full flex items-center justify-center text-pink-500 shadow-sm">
                                                <i :class="item.liked ? 'fa-solid fa-heart' : 'fa-regular fa-heart'"></i>
                                            </button>
                                        </div>
                                        <div class="p-2.5 flex-1 flex flex-col justify-between">
                                            <div>
                                                <h3 class="font-bold text-slate-800 text-sm truncate" x-text="item.name"></h3>
                                                <p class="text-[11px] text-slate-400 truncate" x-text="item.series"></p>
                                                <div class="mt-1 flex items-baseline gap-1">
                                                    <span class="text-brand-darkpink font-extrabold text-sm" x-text="item.price + '.-'"></span>
                                                    <span class="text-[10px] text-slate-400">/ วัน</span>
                                                </div>
                                                <div class="flex flex-wrap gap-1 mt-1 text-[9px] text-slate-500">
                                                    <span class="bg-slate-100 px-1.5 py-0.5 rounded">+ ชุดเต็ม</span>
                                                    <span class="bg-slate-100 px-1.5 py-0.5 rounded">+ วิก</span>
                                                </div>
                                            </div>
                                            
                                            <div class="mt-3 flex gap-1">
                                                <button @click="openDetail(item)" class="flex-1 py-1.5 bg-pink-50 text-brand-darkpink text-xs font-semibold rounded-lg hover:bg-pink-100 transition">รายละเอียด</button>
                                                <button @click="startBooking(item)" class="flex-1 py-1.5 bg-brand-darkpink text-white text-xs font-semibold rounded-lg shadow hover:bg-brand-deep transition flex items-center justify-center gap-1">
                                                    <i class="fa-solid fa-cart-shopping text-[10px]"></i> จองคิว
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>

                    </div>

                    <!-- ----------------------------------------- -->
                    <!-- PAGE 2: COSTUME DETAIL MODAL/VIEW -->
                    <!-- ----------------------------------------- -->
                    <div x-show="activeTab === 'detail'" class="p-4 space-y-4">
                        <button @click="activeTab = 'home'" class="flex items-center gap-2 text-slate-600 font-medium text-sm mb-2 hover:text-brand-darkpink">
                            <i class="fa-solid fa-chevron-left"></i> ย้อนกลับ
                        </button>

                        <template x-if="selectedCostume">
                            <div class="space-y-4">
                                <div class="relative rounded-2xl overflow-hidden shadow-md">
                                    <img :src="selectedCostume.image" class="w-full h-72 object-cover">
                                    <span class="absolute top-3 left-3 bg-brand-darkpink text-white text-xs px-3 py-1 rounded-full font-medium" x-text="selectedCostume.category"></span>
                                </div>

                                <div class="bg-white p-4 rounded-2xl border border-pink-100 space-y-2 shadow-sm">
                                    <div class="flex justify-between items-start">
                                        <div>
                                            <h2 class="text-xl font-bold text-slate-800" x-text="selectedCostume.name"></h2>
                                            <p class="text-xs text-slate-400" x-text="selectedCostume.series"></p>
                                        </div>
                                        <div class="text-right">
                                            <span class="text-2xl font-black text-brand-darkpink" x-text="selectedCostume.price + '.-'"></span>
                                            <span class="text-xs text-slate-400"> / วัน</span>
                                        </div>
                                    </div>

                                    <hr class="border-pink-100 my-2">

                                    <!-- Size Options -->
                                    <div>
                                        <label class="text-xs font-bold text-slate-700 block mb-1">🐾 ไซส์ที่มีให้เช่า:</label>
                                        <div class="flex gap-2">
                                            <template x-for="size in ['S', 'M', 'L', 'XL']">
                                                <span class="px-3 py-1 border border-pink-200 rounded-lg text-xs font-semibold text-slate-700 bg-pink-50/50" x-text="size"></span>
                                            </template>
                                        </div>
                                    </div>

                                    <!-- Measurements -->
                                    <div class="bg-pink-50/50 p-2.5 rounded-xl border border-pink-100 text-xs space-y-1">
                                        <p class="font-bold text-brand-darkpink"><i class="fa-solid fa-ruler-combined"></i> สัดส่วนแนะนำ:</p>
                                        <p class="text-slate-600">อก 70-88 ซม. | เอว 58-70 ซม. | สะโพก 84-96 ซม.</p>
                                    </div>

                                    <!-- Included Items -->
                                    <div>
                                        <label class="text-xs font-bold text-slate-700 block mb-1">📦 รายละเอียดชุดในเซ็ต:</label>
                                        <ul class="text-xs text-slate-600 space-y-1 pl-2">
                                            <li>• เสื้อผ้า + เครื่องประดับครบเซ็ต</li>
                                            <li>• วิกผมเซ็ตทรงแล้ว</li>
                                            <li>• อุปกรณ์ประกอบตัวละครตามภาพ</li>
                                        </ul>
                                    </div>
                                </div>

                                <!-- Promo Discount Tag -->
                                <div class="bg-pink-100 border border-pink-300 p-3 rounded-xl flex items-center gap-3">
                                    <i class="fa-solid fa-gift text-2xl text-brand-darkpink"></i>
                                    <div>
                                        <h4 class="font-bold text-xs text-slate-800">โปรโมชั่นพิเศษ! จองล่วงหน้า 7 วัน</h4>
                                        <p class="text-[11px] text-slate-600">ชำระมัดจำเพียง 50% ของราคาเช่า</p>
                                    </div>
                                </div>

                                <button @click="startBooking(selectedCostume)" class="w-full py-3 bg-brand-darkpink text-white font-bold rounded-xl shadow-lg hover:bg-brand-deep transition flex items-center justify-center gap-2">
                                    <i class="fa-solid fa-calendar-check"></i> จองคิวเช่าชุดนี้
                                </button>
                            </div>
                        </template>
                    </div>

                    <!-- ----------------------------------------- -->
                    <!-- PAGE 3: BOOKING FORM -->
                    <!-- ----------------------------------------- -->
                    <div x-show="activeTab === 'booking'" class="p-4 space-y-4">
                        <!-- Stepper Header -->
                        <div class="flex justify-between items-center text-xs px-4 py-2 bg-white rounded-xl shadow-sm border border-pink-100">
                            <div class="flex items-center gap-1 font-bold text-brand-darkpink">
                                <span class="w-5 h-5 bg-brand-darkpink text-white rounded-full flex items-center justify-center text-[10px]">1</span> กรอกข้อมูล
                            </div>
                            <div class="h-0.5 w-6 bg-slate-200"></div>
                            <div class="flex items-center gap-1 text-slate-400">
                                <span class="w-5 h-5 bg-slate-200 text-slate-600 rounded-full flex items-center justify-center text-[10px]">2</span> ชำระเงิน
                            </div>
                            <div class="h-0.5 w-6 bg-slate-200"></div>
                            <div class="flex items-center gap-1 text-slate-400">
                                <span class="w-5 h-5 bg-slate-200 text-slate-600 rounded-full flex items-center justify-center text-[10px]">3</span> ยืนยัน
                            </div>
                        </div>

                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-pink-100 space-y-3">
                            <h3 class="font-bold text-slate-800 text-sm flex items-center gap-1.5 border-b pb-2">
                                <i class="fa-solid fa-user text-brand-darkpink"></i> ข้อมูลผู้เช่า
                            </h3>

                            <div>
                                <label class="text-xs font-semibold text-slate-700">ชื่อ Facebook *</label>
                                <input type="text" x-model="bookingForm.fbName" placeholder="ชื่อเฟสบุ๊คลูกค้า" class="w-full mt-1 px-3 py-2 border rounded-xl text-xs bg-slate-50 focus:bg-white border-pink-200 focus:outline-none focus:ring-1 focus:ring-brand-darkpink">
                            </div>

                            <div>
                                <label class="text-xs font-semibold text-slate-700">ลิงก์ Facebook *</label>
                                <input type="text" x-model="bookingForm.fbLink" placeholder="https://facebook.com/username" class="w-full mt-1 px-3 py-2 border rounded-xl text-xs bg-slate-50 focus:bg-white border-pink-200 focus:outline-none focus:ring-1 focus:ring-brand-darkpink">
                            </div>

                            <div>
                                <label class="text-xs font-semibold text-slate-700">เบอร์โทรศัพท์ติดต่อ *</label>
                                <input type="tel" x-model="bookingForm.phone" placeholder="08X-XXX-XXXX" class="w-full mt-1 px-3 py-2 border rounded-xl text-xs bg-slate-50 focus:bg-white border-pink-200 focus:outline-none focus:ring-1 focus:ring-brand-darkpink">
                            </div>

                            <div>
                                <label class="text-xs font-semibold text-slate-700">รูปบัตรประชาชน (สำหรับทำสัญญา) *</label>
                                <div class="mt-1 border-2 border-dashed border-pink-200 rounded-xl p-4 text-center bg-pink-50/30">
                                    <i class="fa-solid fa-id-card text-2xl text-pink-300 mb-1 block"></i>
                                    <span class="text-xs text-slate-500">อัปโหลดรูปภาพบัตรประชาชน</span>
                                    <input type="file" @change="handleFileUpload($event)" class="hidden" id="idCardUpload">
                                    <label for="idCardUpload" class="mt-2 inline-block px-3 py-1 bg-white border border-pink-300 text-brand-darkpink text-xs rounded-lg cursor-pointer font-medium hover:bg-pink-50">เลือกไฟล์</label>
                                    <template x-if="bookingForm.idCardName">
                                        <p class="text-[10px] text-green-600 mt-1 font-semibold" x-text="'✓ เลือกแล้ว: ' + bookingForm.idCardName"></p>
                                    </template>
                                </div>
                            </div>
                        </div>

                        <!-- Date Selection & Rule Calculation -->
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-pink-100 space-y-3">
                            <h3 class="font-bold text-slate-800 text-sm flex items-center gap-1.5 border-b pb-2">
                                <i class="fa-solid fa-calendar-days text-brand-darkpink"></i> รายละเอียดการเช่า
                            </h3>

                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <label class="text-[11px] font-semibold text-slate-700">วันที่เช่าใช้งาน *</label>
                                    <input type="date" x-model="bookingForm.startDate" @change="calculatePricing()" class="w-full mt-1 px-2.5 py-1.5 border rounded-xl text-xs border-pink-200 bg-slate-50">
                                </div>
                                <div>
                                    <label class="text-[11px] font-semibold text-slate-700">คืนชุดภายในวันที่ *</label>
                                    <input type="date" x-model="bookingForm.endDate" @change="calculatePricing()" class="w-full mt-1 px-2.5 py-1.5 border rounded-xl text-xs border-pink-200 bg-slate-50">
                                </div>
                            </div>

                            <!-- Dynamic Add-ons List Managed by Admin -->
                            <div>
                                <label class="text-xs font-bold text-slate-700 block mb-1.5">🎀 เลือกเช่าพรอพ/อุปกรณ์เสริมเพิ่มเติม:</label>
                                <div class="space-y-1.5">
                                    <template x-for="addon in availableAddons" :key="addon.id">
                                        <label class="flex items-center justify-between p-2 rounded-xl border border-pink-100 bg-pink-50/20 text-xs cursor-pointer hover:bg-pink-50">
                                            <div class="flex items-center gap-2">
                                                <input type="checkbox" :value="addon.id" x-model="bookingForm.selectedAddons" @change="calculatePricing()" class="accent-brand-darkpink rounded">
                                                <span class="text-slate-700" x-text="addon.name"></span>
                                            </div>
                                            <span class="font-bold text-brand-darkpink" x-text="'+' + addon.price + '.-'"></span>
                                        </label>
                                    </template>
                                </div>
                            </div>

                            <!-- 50% Advance Booking Rule Banner -->
                            <div class="p-3 rounded-xl text-xs border" :class="isEligibleForHalfPay ? 'bg-green-50 border-green-200 text-green-800' : 'bg-amber-50 border-amber-200 text-amber-800'">
                                <div class="font-bold flex items-center gap-1">
                                    <i :class="isEligibleForHalfPay ? 'fa-solid fa-circle-check text-green-600' : 'fa-solid fa-triangle-exclamation text-amber-600'"></i>
                                    <span x-text="isEligibleForHalfPay ? 'เข้าเงื่อนไขจองล่วงหน้า 7 วัน (จ่ายครึ่งราคา 50%)' : 'จองน้อยกว่า 7 วัน (ต้องชำระราคาเต็ม 100%)'"></span>
                                </div>
                                <p class="text-[10px] mt-0.5 opacity-90" x-text="daysInAdvance > 0 ? 'คุณทำการจองล่วงหน้า ' + daysInAdvance + ' วัน' : 'กรุณาเลือกวันเช่าเพื่อคำนวณเงื่อนไข'"></p>
                            </div>

                            <!-- Payment Option Selection -->
                            <div x-show="isEligibleForHalfPay" class="space-y-1">
                                <label class="text-xs font-semibold text-slate-700">รูปแบบการชำระเงิน:</label>
                                <div class="grid grid-cols-2 gap-2">
                                    <button @click="bookingForm.paymentType = 'half'; calculatePricing()" :class="bookingForm.paymentType === 'half' ? 'bg-brand-darkpink text-white font-bold border-brand-darkpink' : 'bg-white text-slate-700 border-pink-200'" class="py-2 border rounded-xl text-xs transition">
                                        มัดจำ 50% (<span x-text="calculatedHalfPrice + '.-'"></span>)
                                    </button>
                                    <button @click="bookingForm.paymentType = 'full'; calculatePricing()" :class="bookingForm.paymentType === 'full' ? 'bg-brand-darkpink text-white font-bold border-brand-darkpink' : 'bg-white text-slate-700 border-pink-200'" class="py-2 border rounded-xl text-xs transition">
                                        ชำระเต็ม 100% (<span x-text="calculatedTotalPrice + '.-'"></span>)
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- Summary Price Box -->

                                + เพิ่มตัวละครใหม่
                            </button>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <template x-for="item in costumes" :key="item.id">
                                <div class="bg-slate-800 rounded-xl p-2 border border-slate-700 relative">
                                    <img :src="item.image" class="w-full h-28 object-cover rounded-lg mb-2">
                                    <h4 class="font-bold text-xs text-white truncate" x-text="item.name"></h4>
                                    <p class="text-[10px] text-pink-400 font-bold" x-text="item.price + '.- / วัน'"></p>
                                    <button @click="deleteCostume(item.id)" class="absolute top-3 right-3 bg-red-600 text-white w-6 h-6 rounded-full text-xs flex items-center justify-center shadow">
                                        <i class="fa-solid fa-trash"></i>
                                    </button>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- ADMIN TAB 4: ADD-ONS PROPS MANAGEMENT -->
                    <div x-show="adminSubTab === 'addons'" class="space-y-4">
                        <h2 class="font-bold text-base text-pink-400 flex items-center gap-2"><i class="fa-solid fa-toolbox"></i> จัดการพรอพ/อุปกรณ์เสริม</h2>

                        <!-- Add New Add-on Form -->
                        <div class="bg-slate-800 p-3 rounded-2xl border border-slate-700 space-y-2">
                            <h3 class="text-xs font-bold text-white">+ เพิ่มพรอพเสริมใหม่</h3>
                            <div class="grid grid-cols-2 gap-2">
                                <input type="text" x-model="newAddon.name" placeholder="ชื่ออุปกรณ์ (เช่น รองเท้าคอส)" class="px-3 py-1.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white">
                                <input type="number" x-model="newAddon.price" placeholder="ราคาเพิ่ม (บาท)" class="px-3 py-1.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white">
                            </div>
                            <button @click="addNewAddon()" class="w-full py-2 bg-brand-darkpink text-white text-xs font-bold rounded-xl hover:bg-brand-deep transition">
                                เพิ่มรายการ
                            </button>
                        </div>

                        <!-- Existing Addons List -->
                        <div class="space-y-2">
                            <template x-for="addon in availableAddons" :key="addon.id">
                                <div class="bg-slate-800 p-3 rounded-xl border border-slate-700 flex justify-between items-center text-xs">
                                    <div>
                                        <span class="font-bold text-white" x-text="addon.name"></span>
                                        <span class="text-pink-400 font-bold ml-2" x-text="'+' + addon.price + ' บาท'"></span>
                                    </div>
                                    <button @click="deleteAddon(addon.id)" class="text-red-400 hover:text-red-300">
                                        <i class="fa-solid fa-trash"></i>
                                    </button>
                                </div>
                            </template>
                        </div>
                    </div>

                </main>
            </div>
        </template>

        <!-- ========================================== -->
        <!-- ADMIN LOGIN POPUP MODAL -->
        <!-- ========================================== -->
        <div x-show="showAdminModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div class="bg-white w-full max-w-xs rounded-3xl p-5 shadow-2xl space-y-4 relative border-4 border-pink-200">
                <button @click="showAdminModal = false" class="absolute top-3 right-3 text-slate-400 hover:text-slate-600">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>

                <div class="text-center space-y-1">
                    <div class="w-12 h-12 bg-pink-100 rounded-full mx-auto flex items-center justify-center text-brand-darkpink text-xl">
                        <i class="fa-solid fa-lock"></i>
                    </div>
                    <h3 class="font-black text-slate-800 text-base">เข้าสู่ระบบแอดมิน</h3>
                    <p class="text-[11px] text-slate-400">PANTERz Cosshop Admin</p>
                </div>

                <div class="space-y-2">
                    <div>
                        <label class="text-[11px] font-semibold text-slate-600">อีเมลของคุณ</label>
                        <input type="email" x-model="adminLogin.email" placeholder="admin@panterz.com" class="w-full mt-1 px-3 py-1.5 border border-pink-200 rounded-xl text-xs focus:outline-none focus:ring-1 focus:ring-brand-darkpink">
                    </div>
                    <div>
                        <label class="text-[11px] font-semibold text-slate-600">รหัสผ่านของคุณ</label>
                        <input type="password" x-model="adminLogin.password" placeholder="••••••••" class="w-full mt-1 px-3 py-1.5 border border-pink-200 rounded-xl text-xs focus:outline-none focus:ring-1 focus:ring-brand-darkpink">
                    </div>
                </div>

                <button @click="loginAdmin()" class="w-full py-2.5 bg-brand-darkpink text-white font-bold rounded-xl shadow-md text-xs hover:bg-brand-deep transition">
                    เข้าสู่ระบบ
                </button>
            </div>
        </div>

    </div>

    <!-- Alpine.js Application Logic Script -->
    <script>
        function cosplayApp() {
            return {
                activeTab: 'home',
                adminSubTab: 'dashboard',
                selectedCategory: 'ทั้งหมด',
                searchQuery: '',
                showAdminModal: false,
                isAdminLoggedIn: false,

                // User Stamp Count
                userStamps: 3,

                // Costume Database List
                costumes: [
                    { id: 1, name: 'Ganyu', series: 'Genshin Impact', category: 'Genshin Impact', price: 600, image: 'https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&q=80&w=400', liked: false },
                    { id: 2, name: 'Sunday', series: 'Honkai: Star Rail', category: 'Honkai: Star Rail', price: 650, image: 'https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&q=80&w=400', liked: false },
                    { id: 3, name: 'Ellen Joe', series: 'Zenless Zone Zero', category: 'Zenless Zone Zero', price: 600, image: 'https://images.unsplash.com/photo-1563089145-599997674d42?auto=format&fit=crop&q=80&w=400', liked: false },
                    { id: 4, name: 'Zero Two', series: 'DARLING in the FRANXX', category: 'อนิเมะ', price: 550, image: 'https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?auto=format&fit=crop&q=80&w=400', liked: false },
                    { id: 5, name: 'Hu Tao', series: 'Genshin Impact', category: 'Genshin Impact', price: 600, image: 'https://images.unsplash.com/photo-1541562232579-512a21360020?auto=format&fit=crop&q=80&w=400', liked: false },
                    { id: 6, name: 'Kafka', series: 'Honkai: Star Rail', category: 'Honkai: Star Rail', price: 600, image: 'https://images.unsplash.com/photo-1579783902614-a3fb3927b675?auto=format&fit=crop&q=80&w=400', liked: false }
                ],

                selectedCostume: null,

                // Available Add-ons (Dynamic managed by Admin)
                availableAddons: [
                    { id: 'shoes', name: 'เช่ารองเท้าเพิ่ม', price: 100 },
                    { id: 'petticoat', name: 'เช่ากระโปรงสุ่มเพิ่ม', price: 100 }
                ],

                // New Addon Form for Admin
                newAddon: { name: '', price: '' },

                // Booking Form State
                bookingForm: {
                    fbName: '',
                    fbLink: '',
                    phone: '',
                    idCardName: '',
                    startDate: '',
                    endDate: '',
                    selectedAddons: [],
                    paymentType: 'full' // 'half' or 'full'
                },

                // Calculation States
                daysInAdvance: 0,
                isEligibleForHalfPay: false,
                calculatedTotalPrice: 0,
                calculatedHalfPrice: 0,
                finalPayAmount: 0,

                // Admin State
                adminLogin: { email: '', password: '' },
                adminOrders: [
                    { id: '#Q202511001', customer: 'คุณมิม', costume: 'Ganyu', dates: '25-27/11/68', status: 'รอชำระเงิน' },
                    { id: '#Q202511000', customer: 'คุณนิน', costume: 'Hu Tao', dates: '24-26/11/68', status: 'ยืนยันแล้ว' },
                    { id: '#Q202510099', customer: 'คุณพิม', costume: 'Kafka', dates: '23-25/11/68', status: 'จัดส่งแล้ว' }
                ],

                queueList: [
                    { id: 1, costume: 'Ganyu (Genshin Impact)', dates: '15-16 พ.ย. 2568', status: 'ยืนยันคิวแล้ว' },
                    { id: 2, costume: 'Hu Tao (Genshin Impact)', dates: '20-22 พ.ย. 2568', status: 'รอตรวจสอบ' }
                ],

                get filteredCostumes() {
                    return this.costumes.filter(item => {
                        const matchCat = this.selectedCategory === 'ทั้งหมด' || item.category === this.selectedCategory;
                        const matchSearch = item.name.toLowerCase().includes(this.searchQuery.toLowerCase()) || 
                                           item.series.toLowerCase().includes(this.searchQuery.toLowerCase());
                        return matchCat && matchSearch;
                    });
                },

                openDetail(item) {
                    this.selectedCostume = item;
                    this.activeTab = 'detail';
                },

                startBooking(item) {
                    this.selectedCostume = item;
                    this.activeTab = 'booking';
                    this.calculatePricing();
                },

                handleFileUpload(e) {
                    const file = e.target.files[0];
                    if(file) this.bookingForm.idCardName = file.name;
                },

                handleSlipUpload(e) {
                    alert('อัปโหลดสลิปเรียบร้อยแล้วค่ะ!');
                },

                calculatePricing() {
                    if (!this.selectedCostume) return;

                    let basePrice = this.selectedCostume.price;

                    // Addons price calculation
                    let addonsTotal = 0;
                    this.bookingForm.selectedAddons.forEach(addonId => {
                        const found = this.availableAddons.find(a => a.id === addonId);
                        if(found) addonsTotal += found.price;
                    });

                    this.calculatedTotalPrice = basePrice + addonsTotal;
                    this.calculatedHalfPrice = Math.round(this.calculatedTotalPrice / 2);

                    // Calculate Days in Advance Rule
                    if (this.bookingForm.startDate) {
                        const today = new Date();
                        const start = new Date(this.bookingForm.startDate);
                        const diffTime = start - today;
                        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                        
                        this.daysInAdvance = diffDays > 0 ? diffDays : 0;
                        this.isEligibleForHalfPay = this.daysInAdvance >= 7;

                        if (!this.isEligibleForHalfPay) {
                            this.bookingForm.paymentType = 'full';
                        }
                    }

                    this.finalPayAmount = (this.bookingForm.paymentType === 'half' && this.isEligibleForHalfPay) 
                        ? this.calculatedHalfPrice 
                        : this.calculatedTotalPrice;
                },

                proceedToPayment() {
                    if (!this.bookingForm.fbName || !this.bookingForm.startDate) {
                        alert('กรุณากรอกข้อมูลและเลือกวันที่เช่าให้ครบถ้วนก่อนนะคะ');
                        return;
                    }
                    this.activeTab = 'payment';
                },

                copyAccount() {
                    navigator.clipboard.writeText('0812345678');
                    alert('คัดลอกเลขบัญชี PromptPay เรียบร้อยแล้ว!');
                },

                confirmBookingComplete() {
                    // Add Stamp Reward
                    if(this.userStamps < 8) this.userStamps++;

                    alert('ขอบคุณสำหรับการจองค่ะ! ระบบได้ทำการบันทึกคิวในปฏิทินและสะสม 1 แต้มให้คุณแล้วค่ะ ✨');
                    this.activeTab = 'home';
                },

                loginAdmin() {
                    if (this.adminLogin.email && this.adminLogin.password) {
                        this.isAdminLoggedIn = true;
                        this.showAdminModal = false;
                    } else {
                        alert('กรุณากรอกอีเมลและรหัสผ่าน');
                    }
                },

                addNewAddon() {
                    if (this.newAddon.name && this.newAddon.price) {
                        this.availableAddons.push({
                            id: 'addon_' + Date.now(),
                            name: this.newAddon.name,
                            price: parseInt(this.newAddon.price)
                        });
                        this.newAddon.name = '';
                        this.newAddon.price = '';
                    }
                },

                deleteAddon(id) {
                    this.availableAddons = this.availableAddons.filter(a => a.id !== id);
                },

                deleteCostume(id) {
                    this.costumes = this.costumes.filter(c => c.id !== id);
                }
            }
        }
    </script>
</body>
</html>
